function reserveForm(id=''){let p=E.policy(state,E.month(E.today())),r=p.reserves.find(r=>r.id===id)||{name:'',annual:0,active:true,group:'',categories:[]};let used=p.reserves.filter(x=>x.id!==id&&x.active).flatMap(x=>E.reserveCategories(state,x));sheet(id?'Edit annual reserve':'Create an annual reserve',`${field('Name','name',r.name,'text','required maxlength="60"')}${field('Annual allowance ('+state.settings.base+')','annual',amt(r.annual),'number','min="0.01" step="0.01" required')}${check('Active reserve','active',r.active)}${select('Link a whole group (optional)','group',[['','Choose categories below'],...state.groups.filter(g=>state.categories.some(c=>c.group===g.id&&c.type==='expense')).map(g=>[g.id,g.name])],r.group)}<h3>Or select categories</h3><div class="checkbox-list">${state.categories.filter(c=>c.type==='expense').map(c=>check(esc(c.name)+(used.includes(c.id)?' · reserved elsewhere':''),'categories',r.categories.includes(c.id),`value="${c.id}" ${used.includes(c.id)?'disabled':''}`)).join('')}</div><p>Linked spending is excluded from the controllable budget while this reserve is active. Its annual provision is spread over 12 months for affordability.</p>${actions('Save reserve',id?'delete-reserve':'',id)}`,fd=>{let value={id:id||E.uid(),name:fd.get('name').trim(),annual:minors(fd.get('annual')),active:!!fd.get('active'),group:fd.get('group'),categories:fd.get('group')?[]:fd.getAll('categories')},categories=E.reserveCategories(state,value);if(!categories.length)throw Error('Link at least one expense category or group.');if(value.active&&categories.some(c=>used.includes(c)))throw Error('Another active reserve already includes one of these categories.');setPolicy(p=>{p.reserves=p.reserves.filter(x=>x.id!==id);p.reserves.push(value);});toast('Annual reserve saved');});}
function planForm(id=''){let original=state.plans.find(p=>p.id===id),p=original?E.planAt(original,E.month(E.today())):{name:'',type:'expense',category:'rent',amount:0,frequency:'monthly',start:E.today(),end:'',count:'',logged:0,active:true,periodic:false,account:''};if(p.installment){sheet('Installment purchase',`<h3>${esc(p.name)}</h3>${pair('Full economic purchase',cash(p.total,true))}${pair('Original purchase',esc(p.originalTotal)+' '+esc(p.currency))}${pair('First payment',dateLabel(p.start))}${pair('Number of payments',p.count)}<div class="table-wrap"><table><thead><tr><th>Due date</th><th>Amount</th><th>Status</th></tr></thead><tbody>${E.schedule(state,p.start,E.occurrenceDate(p,p.count-1)).filter(x=>x.planId===p.id).map(x=>`<tr><td>${x.date}</td><td>${cash(x.amount,true)}</td><td>${x.paid?'Recorded':button('Record','log-occurrence','link-btn',`data-id="${p.id}" data-date="${x.date}"`)}</td></tr>`).join('')}</tbody></table></div><p class="spaced">Editing an actual installment does not change the agreed purchase schedule. To stop future payments, pause this plan.</p>${button(p.active?'Pause future installments':'Resume future installments','toggle-plan','btn secondary',`data-id="${p.id}"`)}${button('Delete plan','delete-plan','link-btn danger-text',`data-id="${p.id}"`)}`);return;}
sheet(id?'Edit payment plan':'Add a payment plan',`${field('Name','name',p.name,'text','required maxlength="80"')}<div class="form-grid">${select('Type','type',[['expense','Expense'],['income','Income']],p.type,original?'disabled':'')}${select('Category','category',state.categories.map(c=>[c.id,c.name]),p.category)}</div>${field('Amount per payment ('+state.settings.base+')','amount',amt(p.amount),'number','min="0.01" step="0.01" required')}<div class="form-grid">${select('Frequency','frequency',['weekly','monthly','quarterly','semiannual','yearly'],p.frequency,original?'disabled':'')}${field('First due date','start',p.start,'date',`required ${original?'readonly':''}`)}</div><div class="form-grid">${field('Last date (optional)','end',p.end||'','date')}${field('Total occurrences (optional)','count',p.count||'','number','min="1" max="1000" step="1"')}</div>${field('Already logged before tracking','logged',p.logged||0,'number','min="0" max="1000" step="1"','Skips the first occurrences without creating transactions. Do not include payments you record in this ledger.')}${select('Account','account',[['','No account'],...state.accounts.map(a=>[a.id,a.name])],p.account)}${check('Active plan','active',p.active)}${check('Periodic bill: spread the economic cost between payments','periodic',p.periodic)}<p>Cash forecasts always use the real due dates. Periodic bills use their monthly equivalent in the savings path. A regular variable expense should not be marked as a periodic bill.</p>${original?'<p>Amount, category and active-state changes apply from the current month. The original schedule stays anchored to its first due date.</p>':''}${actions('Save payment plan',id?'delete-plan':'',id)}`,fd=>{let v={name:fd.get('name').trim(),type:original?.type||fd.get('type'),category:fd.get('category'),amount:minors(fd.get('amount')),active:!!fd.get('active'),periodic:!!fd.get('periodic'),account:fd.get('account'),logged:Number(fd.get('logged')||0)},start=original?.start||fd.get('start'),end=fd.get('end')||'',count=Number(fd.get('count')||0)||null,frequency=original?.frequency||fd.get('frequency');if(E.category(state,v.category).type!==v.type)throw Error('Choose a category matching the payment type.');if(end&&end<start)throw Error('The end date must be on or after the first due date.');if(count&&v.logged>count)throw Error('Logged occurrences cannot exceed the total.');commit(s=>{if(id){let plan=s.plans.find(x=>x.id===id),m=E.month(E.today());plan.versions=(plan.versions||[]).filter(v=>v.from!==m);plan.versions.push({...v,from:m,end,count});}else s.plans.push({id:E.uid(),...v,start,end,count,frequency});},{reason:'Payment plan saved'});toast('Payment plan saved');});}
function manager(kind){let labels={categories:['Categories','category'],groups:['Category groups','group'],people:['People','person'],tags:['Tags','tag']},[title,singular]=labels[kind];sheet(title,`<p>${kind==='categories'?'Categories are the selectable subcategories used on transactions. Groups organize them. Budget assignments can cross groups.':kind==='people'?'Assign a person or split a transaction. Unassigned transactions are supported.':kind==='tags'?'Add as many tags as you need to a purchase. Tags have their own colors.':'Organize related categories, with a shared icon and color.'}</p>${button('Add '+singular,'entity-add','btn',`data-kind="${kind}"`)}${kind==='categories'?button('Manage groups','groups','link-btn'):''}<div class="spaced">${state[kind].map(x=>`<button class="list-action" data-action="entity-edit" data-kind="${kind}" data-id="${x.id}"><span class="entity-icon" style="--item-color:${esc(x.color)}">${esc(x.icon||'●')}</span><span class="grow"><b>${esc(x.name)}${x.archived?' · archived':''}</b><small>${kind==='categories'?(state.groups.find(g=>g.id===x.group)?.name||'')+' · '+(E.rule(state,x.id,E.month(E.today())).budget?'Inside budget':'Outside budget'):kind==='people'&&state.settings.defaultPerson===x.id?'Default person':''}</small></span><span>›</span></button>`).join('')}</div>`);}
function entityForm(kind,id=''){let x=state[kind].find(x=>x.id===id)||{name:'',color:state.settings.accent,icon:'◇',type:'expense',group:state.groups[0]?.id,budget:true,behavior:'auto',personAnalysis:true},rule=kind==='categories'?E.rule(state,id,E.month(E.today())):x;if(!id)rule=x;let singular={categories:'category',groups:'group',people:'person',tags:'tag'}[kind];sheet((id?'Edit ':'Add ')+singular,`${field('Name','name',x.name,'text','required maxlength="70"')}<div class="form-grid">${field('Color','color',x.color,'color')}${['categories','groups'].includes(kind)?field('Icon','icon',x.icon,'text','maxlength="4" required'):''}</div>${kind==='categories'?`${select('Category group','group',state.groups.map(g=>[g.id,g.name]),x.group)}${select('Transaction type','type',[['expense','Expense'],['income','Income']],x.type,id?'disabled':'')}${check('Include in controllable budget','budget',rule.budget)}${check('Include in people analysis','personAnalysis',rule.personAnalysis!==false)}${select('Forecast behavior','behavior',[['auto','Learn from spending history'],['frequent','Frequent purchases'],['cadence','Cadence-based purchases'],['irregular','Irregular / lumpy spending'],['scheduled','Scheduled plans only'],['annual','Annual bill — use an explicit payment plan'],['none','No variable forecast']],rule.behavior)}${check('Archive from new transaction choices','archived',x.archived)}<p>Budget and forecast changes apply from this month. Annual bills need an explicit payment plan; past variable transactions are never automatically annualized.</p>`:''}${kind==='people'?check('Use as default person','default',state.settings.defaultPerson===id):''}${actions('Save '+singular,id?'delete-entity':'',id)}<input type="hidden" name="kind" value="${kind}">`,fd=>{let v={id:id||E.uid(),name:fd.get('name').trim(),color:fd.get('color')};if(state[kind].some(x=>x.id!==id&&x.name.toLowerCase()===v.name.toLowerCase()))throw Error('That name already exists.');if(['categories','groups'].includes(kind))v.icon=fd.get('icon');if(kind==='categories')Object.assign(v,{group:fd.get('group'),type:x.type&&id?x.type:fd.get('type'),budget:!!fd.get('budget'),personAnalysis:!!fd.get('personAnalysis'),behavior:fd.get('behavior'),archived:!!fd.get('archived')});commit(s=>{if(id){let item=s[kind].find(x=>x.id===id);if(kind==='categories'){let p=E.clone(E.policy(s,E.month(E.today())));p.from=E.month(E.today());p.rules[id]={budget:v.budget,personAnalysis:v.personAnalysis,behavior:v.behavior};s.policies=s.policies.filter(x=>x.from!==p.from);s.policies.push(p);delete v.budget;delete v.personAnalysis;delete v.behavior;}Object.assign(item,v);}else s[kind].push(v);if(kind==='people'){if(fd.get('default'))s.settings.defaultPerson=v.id;else if(s.settings.defaultPerson===id)s.settings.defaultPerson='';}},{reason:'Updated '+singular});toast(singular[0].toUpperCase()+singular.slice(1)+' saved');});let deleteBtn=D.querySelector('[data-action=delete-entity]');if(deleteBtn)deleteBtn.dataset.kind=kind;}
function accountsView(){let b=E.balances(state);sheet('Accounts',`<div class="stat-label">Total tracked balance</div><div class="large number">${cash(b.total,true)}</div><p class="spaced">Credit balances are signed: a negative balance means money owed. Balances include all transactions dated through today.</p><div class="row wrap">${button('Add account','account-add','btn')}${state.accounts.length>1?button('Transfer money','transfer-add','btn secondary'):''}</div><div class="spaced">${b.accounts.map(a=>`<button class="list-action" data-action="account-edit" data-id="${a.id}"><span class="entity-icon">${icon('wallet')}</span><span class="grow"><b>${esc(a.name)}</b><small>${a.type} · opened ${dateLabel(a.openingDate)}</small></span><b class="number">${cash(a.balance,true)}</b></button>`).join('')}</div>${pair('Unassigned cash movement',cash(b.unassigned,true))}<details class="spaced"><summary>Transfers (${state.transfers.length})</summary>${state.transfers.toSorted((a,b)=>b.date.localeCompare(a.date)).map(t=>`<button class="list-action" data-action="transfer-edit" data-id="${t.id}"><span class="grow"><b>${esc(state.accounts.find(a=>a.id===t.from)?.name)} → ${esc(state.accounts.find(a=>a.id===t.to)?.name)}</b><small>${dateLabel(t.date)} · ${esc(t.note||'')}</small></span><b>${cash(t.amount,true)}</b></button>`).join('')}</details>`);}
function accountForm(id=''){let a=state.accounts.find(a=>a.id===id)||{name:'',type:'bank',opening:0,openingDate:E.today()};sheet(id?'Edit account':'Add an account',`${field('Name','name',a.name,'text','required maxlength="60"')}${select('Account type','type',[['bank','Bank account'],['savings','Savings account'],['cash','Cash'],['credit','Credit card / credit account']],a.type)}${field('Opening balance ('+state.settings.base+')','opening',amt(a.opening),'number','step="0.01" required','Use a negative amount for money owed on credit.')}${field('Opening date','openingDate',a.openingDate,'date','required')}<p>The opening balance is the balance before transactions on this date. Account balances use the base currency.</p>${actions('Save account',id?'delete-account':'',id)}`,fd=>{let openingDate=fd.get('openingDate');if(state.transactions.some(t=>t.account===id&&t.date<openingDate)||state.transfers.some(t=>(t.to===id||t.from===id)&&t.date<openingDate))throw Error('The opening date must be on or before the account’s first transaction or transfer.');commit(s=>{let v={id:id||E.uid(),name:fd.get('name').trim(),type:fd.get('type'),opening:minors(fd.get('opening')),openingDate};s.accounts=s.accounts.filter(a=>a.id!==id);s.accounts.push(v);});toast('Account saved');});}

function preferences(){sheet('Appearance & preferences',`${select('Appearance','theme',[['light','Light'],['dark','Dark'],['system','Follow device']],state.settings.theme)}${field('Accent color','accent',state.settings.accent,'color')}${select('Base currency','base',currencies,state.settings.base,state.transactions.length||state.accounts.length||state.plans.length?'disabled':'')}${state.transactions.length||state.accounts.length||state.plans.length?'<p>Base currency is fixed once financial records exist, so changing a label cannot change the meaning of saved money. Individual purchases can use another currency.</p>':''}${field('Tracking start date','trackingStart',state.settings.trackingStart,'date','required','Sets the observation window for spending patterns. Earlier saved financial history is preserved.')}${actions('Save preferences')}`,fd=>{let start=fd.get('trackingStart');if(start>E.today())throw Error('Tracking start cannot be in the future.');if(state.transactions.some(t=>t.date<start))throw Error('Tracking start must be on or before your earliest transaction.');commit(s=>{s.settings.theme=fd.get('theme');s.settings.accent=fd.get('accent');s.settings.base=fd.get('base')||s.settings.base;s.settings.trackingStart=start;});toast('Preferences saved');});}

function forecastDetails(){let f=E.forecast(state,period),b=E.budget(state,period);sheet('Month-end forecast',`<p>${monthLabel(period)} · complete ledger, before transaction filters.</p>${pair('Actual cash spent',cash(f.actual.expense))}${pair('Expected remaining cash expense',cash(f.expense-f.actual.expense))}${pair('Projected total cash expense',cash(f.expense))}${pair('Projected cash income',cash(f.income))}${pair('Projected cash saving',cash(f.saving))}${pair('Projected controllable spending',cash(f.budget))}${b.enabled?pair('Applied controllable budget',cash(b.effective)):''}<details open><summary>What is expected</summary>${f.breakdown.filter(x=>x.total>0).map(x=>`<div class="history-point"><div class="row-between"><h3>${esc(E.category(state,x.category).name)}</h3><b>${cash(x.total)}</b></div><small>${x.kind} · ${x.confidence.toLowerCase()} confidence · ${x.window} observed days</small>${pair('Already recorded',cash(x.actual))}${pair('Pending planned payments',cash(x.scheduled))}${pair('Expected variable spending',cash(x.variable))}</div>`).join('')}</details><p class="spaced">Frequent and irregular spending use the full recent observation window. Cadence estimates include quiet days. Annual and scheduled-only categories rely on explicit plans. Sparse history can understate future spending; these are estimates, not guarantees.</p>${button('Save another forecast snapshot','snapshot-now','btn secondary')}${button('View saved forecasts','forecast-history','link-btn')}`);}
function forecastHistory(){sheet('Forecast history',`<p>Saved estimates remain unchanged when transactions or the forecasting model later change.</p>${state.forecastSnapshots.toSorted((a,b)=>b.date.localeCompare(a.date)).slice(0,100).map((f,i)=>`<details class="history-point"><summary>${dateLabel(f.date)} · ${monthLabel(f.period||f.month)}</summary>${pair('Projected expense',cash(f.expense))}${pair('Projected income',cash(f.income))}${pair('Projected saving',cash(f.saving))}${pair('Controllable forecast',cash(f.budget))}${pair('Actual expense at snapshot',cash(f.actual.expense))}${pair('Model',esc(f.model))}<div class="table-wrap"><table><thead><tr><th>Category</th><th>Then forecast</th></tr></thead><tbody>${f.breakdown.map(x=>`<tr><td>${esc(E.category(state,x.category).name)}</td><td>${cash(x.total)}</td></tr>`).join('')}</tbody></table></div></details>`).join('')||'<p>No snapshots yet.</p>'}<details class="spaced"><summary>Daily opening history</summary>${Object.values(state.daily).toSorted((a,b)=>b.date.localeCompare(a.date)).slice(0,90).map(d=>pair(d.date,cash(d.safe))).join('')}</details>`);}
const explanations={
'explain-safe':['Safe to spend today',()=>{let at=E.today(),s=E.safe(state,at),opening=state.daily[at];return `<p>The opening allowance divides eligible money across the remaining weighted days. Spending today reduces what is left, while the original opening is preserved.</p>${s.rows.map(r=>`<h3 class="spaced">${esc(r.name)}</h3>${pair('Available before today',cash(r.available))}${pair('Safely borrowable',cash(r.borrow))}${pair('Calculated day opening',cash(r.opening))}${pair('Spent today',cash(r.todaySpent))}`).join('')}<p class="spaced">Other monthly pools only contribute money left after expected future spending and their minimum protection. Smart rhythms learn from up to 84 prior days; custom weights preserve the same overall budget.</p><p>Opening comparisons are shown only when both days share the same plan and month. If you change the plan, current guidance is recalculated and the comparison is hidden; the saved opening stays unchanged.</p>${opening?pair('Preserved opening for '+at,cash(opening.safe)):''}`;}],
'explain-spending':['Your spending',()=>'<p>Spending includes every expense recorded through today, whether it is inside the controllable budget, a bill, or linked to an annual reserve. Transfers are excluded. Future-dated records are counted when their date arrives.</p>'],
'explain-savings':['Cash saving & the planning path',()=>'<p>Actual cash saving is actual income minus actual expenses. Its percentage divides that difference by actual income. With no income, the percentage is left blank. Current periods show amounts to date.</p><p>The savings target uses recurring income. One-time income improves cash saving without increasing ongoing lifestyle spending.</p><p>For the annual planning path, explicitly periodic bills are smoothed over their payment interval and annual reserves use their monthly provision. This prevents a large due payment from also becoming an artificial catch-up penalty. Actual cash saving remains separate and unsmoothed.</p><p>Only closed months contribute to catch-up. Their planning shortfall or surplus is divided across the remaining months. Explicit edits to old transactions update actual saving; their historical targets and rollover stay preserved.</p>'],
'explain-budget':['How your budget is set',()=>{let b=E.budget(state,period);return `<p>The monthly ceiling covers controllable spending. With a savings target, the app first calculates the room left after planned costs and saving, then applies your minimum and maximum.</p>${pair('Recurring monthly income',cash(b.income))}${pair('Normalized outside-budget expenses',cash(b.unavoidable))}${pair('Annual reserve monthly provision',cash(b.reserve))}${pair('Savings path requirement',cash(b.path.required))}${pair('Savings-compatible budget',cash(b.compatible))}${pair('Minimum',cash(b.minimum))}${pair('Maximum',b.maximum==null?'Off':cash(b.maximum))}${pair('Applied budget',b.effective==null?'Off':cash(b.effective))}<p class="spaced">Sub-budgets are soft allocations inside this limit. Minimums protect allocations, not transactions. Automatic rebalancing uses forecast-unused donor room, never increases the main budget, and keeps the original plan visible.</p>`;}],
'remainder-info':['Everything else',()=>'<p>This automatic pool contains controllable categories that have not been assigned to a custom sub-budget. New unassigned categories naturally join it.</p><p>It takes the remaining percentage, as adjusted by minimum and maximum rules. Its default rhythm is monthly and it does not roll over.</p>'],
'about':['About The Ledger',()=>'<p>The Ledger 1.0 is a self-contained application. All calculations, charts and data entry work without external services. No transaction data is sent to a server.</p><p>Your data belongs to this browser and origin. Moving the HTML to another location or opening it in another browser can use a different data store. Export a backup before moving or upgrading.</p><h3>On iPhone</h3><p>The layout supports standalone home-screen display. iOS normally requires an HTTP(S) page for “Add to Home Screen”; a downloaded HTML preview in Files is not the same as an installed app. This single-file delivery cannot install a service worker, so an online home-screen shortcut is not guaranteed to reopen without a connection. An already loaded page has no network dependency.</p><h3>Local protection</h3><p>Each save writes the primary ledger and attempts an independent IndexedDB recovery snapshot. Browser data clearing can erase both, so keep an exported backup elsewhere.</p><h3>Exchange rates</h3><p>Enter the rate you actually received. The ledger remembers rates and their dates locally. No live rate service is required.</p>']
};
function download(name,content,type='application/json'){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportBackup(){let obj={format:'ledger-backup',exportedAt:new Date().toISOString(),mode,state};download(`The_Ledger_${mode}_${E.today()}.json`,JSON.stringify(obj,null,2));toast('Backup exported');}
function exportCSV(){let rows=[['Date','Time','Type','Category','Group','Base amount','Base currency','Original amount','Original currency','Rate','Rate date','Rate source','Person','Splits','Tags','Account','Note','Plan','Occurrence'],...periodTx().map(t=>[t.date,t.time,t.type,E.category(state,t.category).name,state.groups.find(g=>g.id===E.category(state,t.category).group)?.name,t.amount/100,state.settings.base,t.original,t.currency,t.rate,t.rateDate,t.rateSource,state.people.find(p=>p.id===t.person)?.name,(t.splits||[]).map(p=>(state.people.find(x=>x.id===p.id)?.name||'')+': '+p.pct+'%').join('; '),(t.tags||[]).map(id=>state.tags.find(t=>t.id===id)?.name).join('; '),state.accounts.find(a=>a.id===t.account)?.name,t.note,state.plans.find(p=>p.id===t.planId)?.name,t.occurrence])];let cell=v=>{let t=String(v??'');if(/^[=+@\-\t\r]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"';};download(`The_Ledger_Activity_${period}.csv`,'\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
async function backupView(){sheet('Backup & recovery',`<p>${mode==='demo'?'This protects only your demo sandbox.':'Keep a copy somewhere outside this browser.'} Recovery snapshots cannot protect against clearing all browser data.</p>${button('Export complete backup','export-backup','btn full')}<h3 class="spaced">Import a backup</h3><p>Import is a full replacement after review. Your current state is snapshotted first.</p><label class="field"><span>Choose a Ledger JSON backup</span><input type="file" id="import-file" accept="application/json,.json"></label><h3 class="spaced">Local recovery snapshots</h3><div id="recovery-items"><p>Loading snapshots…</p></div>`);$('#import-file').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{if(file.size>30*1024*1024)throw Error('This backup is larger than 30 MB.');let raw=JSON.parse(await file.text()),candidate=E.migrate(raw.state||raw);if(mode==='real'&&(raw.mode==='demo'||candidate.meta?.demo))throw Error('Demo backups can only be imported in Demo Mode.');if(mode==='demo'&&!candidate.meta?.demo)throw Error('Real-ledger backups are not copied into Demo Mode.');sheet('Review backup import',`<p>This will replace the ${mode==='demo'?'demo':'real'} ledger on this browser with the selected backup.</p>${pair('Transactions',candidate.transactions.length)}${pair('Accounts',candidate.accounts.length)}${pair('Plans',candidate.plans.length)}${pair('Currency',esc(candidate.settings.base))}<p class="spaced">Export your current ledger first if you want an external copy.</p>${button('Export current ledger','export-backup','btn secondary')}${actions('Replace with this backup')}`,()=>restoreCandidate(candidate,'Imported backup'));}catch(e){toast(e.message);}});
try{let all=await recoveryList();if(!$('#recovery-items'))return;$('#recovery-items').innerHTML=all.length?all.slice(0,12).map(r=>`<button class="list-action" data-action="restore-snapshot" data-id="${r.id}"><span class="grow"><b>${esc(new Date(r.date).toLocaleString())}</b><small>${esc(r.reason)} · ${Math.round(r.raw.length/1024)} KB</small></span><span>Restore ›</span></button>`).join(''):'<p>No snapshots saved yet.</p>';}catch(e){if($('#recovery-items'))$('#recovery-items').textContent=e.message;}}
async function restoreCandidate(candidate,reason){try{let raw=localStorage.getItem(key());if(raw)await recoveryWrite(raw,'Before '+reason);candidate=E.clone(candidate);candidate.revision=(state?.revision||0)+1;E.validate(candidate);localStorage.setItem(key(),JSON.stringify(candidate));state=candidate;tabRevision=state.revision;blocked=false;storageIssue='';recoveryWrite(JSON.stringify(candidate),reason).catch(()=>{storageIssue='Restored, but a new recovery snapshot could not be saved.';render();});closeSheet();E.closePeriods(state);E.snapshots(state);localStorage.setItem(key(),JSON.stringify(state));render();toast('Ledger restored');}catch(err){toast('Restore failed: '+err.message);}}
async function restoreSnapshot(id){try{let item=(await recoveryList()).find(x=>String(x.id)===String(id));if(!item||hash(item.raw)!==item.checksum)throw Error('This snapshot failed its integrity check. Choose another snapshot.');let candidate=E.migrate(JSON.parse(item.raw));sheet('Restore this snapshot?',`<p>${esc(new Date(item.date).toLocaleString())} · ${candidate.transactions.length} transactions. This replaces the current ${mode==='demo'?'demo':'real'} ledger. A snapshot of the current state will be kept first.</p>${actions('Restore snapshot')}`,()=>restoreCandidate(candidate,'Restored snapshot'));}catch(err){toast(err.message);}}
function deleteConfirm(title,message,mutate){sheet(title,`<p>${message}</p>${actions('Delete')}`,()=>{commit(mutate,{reason:title});toast('Deleted');});}
async function enterDemo(){try{if(mode==='demo')return;closeSheet();mode='demo';sessionStorage.setItem('ledger-mode','demo');await boot();toast('Demo Mode · your real ledger is untouched');}catch(err){toast(err.message);}}
async function exitDemo(){mode='real';try{sessionStorage.setItem('ledger-mode','real');}catch(e){}closeSheet();await boot();}
function resetDemo(){if(mode!=='demo')return;sheet('Reset demo ledger?',`<p>Replace only the demo sandbox with fresh sample data. Your real ledger is unaffected.</p>${actions('Reset demo')}`,async()=>{try{let sample=E.demo();sample.revision=state.revision+1;localStorage.setItem(key(),JSON.stringify(sample));state=sample;tabRevision=sample.revision;await recoveryWrite(JSON.stringify(sample),'Demo reset');closeSheet();render();toast('Demo reset');}catch(e){toast(e.message);}});}
async function boot(){blocked=false;storageIssue='';route='today';filters={};period=E.month(E.today());view='month';try{let raw=localStorage.getItem(key());state=raw?E.migrate(JSON.parse(raw)):mode==='demo'?E.demo():E.fresh();if(mode==='real'&&state.meta?.demo)throw Error('The real ledger contains demo-marked data. Restore a real backup to continue.');E.closePeriods(state);E.snapshots(state);E.validate(state);localStorage.setItem(key(),JSON.stringify(state));tabRevision=state.revision;render();recoveryWrite(JSON.stringify(state),'Opened ledger').catch(e=>{storageIssue='Local recovery is unavailable. Export a backup to protect your data.';render();});}catch(err){blocked=true;state=null;A.innerHTML=`<main class="main"><section class="surface"><div class="empty"><h1>Let’s protect your ledger.</h1><p class="spaced">${esc(err.message)}</p><p>The stored data has not been overwritten. You can download it, restore a compatible snapshot, or start fresh after saving it.</p>${button('Download stored data','export-raw','btn')}${button('Find recovery snapshots','blocked-recovery','btn secondary')}${button('Start fresh…','start-fresh','link-btn')}${mode==='demo'?button('Exit demo','exit-demo','btn secondary'):''}</div></section></main>`;}}

'log-occurrence':el=>{let p=state.plans.find(p=>p.id===el.dataset.id),x=E.schedule(state,p.start,el.dataset.date).find(x=>x.planId===p.id&&x.date===el.dataset.date);if(!x||x.paid){toast('This occurrence has already been recorded.');return;}txForm('',{type:x.type,amount:x.amount,original:p.installment&&p.originalParts?p.originalParts[x.index]/100:x.amount/100,currency:p.installment?p.currency:state.settings.base,rate:p.installment?p.rate:1,category:x.category,date:x.date,planId:x.planId,occurrence:x.date,note:x.name,account:x.account,incomeKind:x.type==='income'?'recurring':'oneTime'});},

'delete-sub':el=>{let id=el.dataset.id;sheet('Delete sub-budget?',`<p>Its categories return to Everything else from this month. Historical plans stay unchanged.</p>${actions('Delete sub-budget')}`,()=>setPolicy(p=>p.subs=p.subs.filter(x=>x.id!==id)));},
'delete-reserve':el=>{let id=el.dataset.id;sheet('Delete annual reserve?',`<p>This removes the reserve from the current financial plan. Older months retain their original reserve settings.</p>${actions('Delete reserve')}`,()=>setPolicy(p=>p.reserves=p.reserves.filter(x=>x.id!==id)));},
'delete-plan':el=>{let id=el.dataset.id,p=state.plans.find(p=>p.id===id);if(state.transactions.some(t=>t.planId===id)){sheet('Keep the payment history',`<p>This plan has recorded transactions. Pause future payments to keep the history and purchase relationships intact.</p>${button('Pause future payments','toggle-plan','btn',`data-id="${id}" data-pause="true"`)}`);return;}deleteConfirm('Delete payment plan?',`Delete ${esc(p.name)} and its unpaid schedule?`,s=>s.plans=s.plans.filter(x=>x.id!==id));},
 'toggle-plan':el=>commit(s=>{let p=s.plans.find(p=>p.id===el.dataset.id),m=E.month(E.today()),active=el.dataset.pause?false:!E.planAt(p,m).active;let currentVersion=(p.versions||[]).find(v=>v.from===m)||{};p.versions=(p.versions||[]).filter(v=>v.from!==m);p.versions.push({...currentVersion,from:m,active});},{reason:'Payment plan status changed'}),
settings:settingsView,preferences,overview:overviewForm,categories:()=>manager('categories'),groups:()=>manager('groups'),people:()=>manager('people'),tags:()=>manager('tags'),'entity-add':el=>entityForm(el.dataset.kind),'entity-edit':el=>entityForm(el.dataset.kind,el.dataset.id),
'delete-entity':el=>{let kind=el.dataset.kind,id=el.dataset.id;if(kind==='categories'&&(state.transactions.some(t=>t.category===id)||state.plans.some(p=>p.category===id)||state.policies.some(p=>p.subs.some(b=>b.categories.includes(id))||p.reserves.some(r=>E.reserveCategories(state,r).includes(id))))){toast('This category has history or assignments. Archive it instead.');return;}if(kind==='groups'&&(state.categories.some(c=>c.group===id)||state.policies.some(p=>p.reserves.some(r=>r.group===id)))){toast('Move this group’s categories and reserves before deleting it.');return;}if(kind==='people'&&state.transactions.some(t=>t.person===id||t.splits?.some(p=>p.id===id))){toast('This person is linked to transactions and cannot be deleted.');return;}if(kind==='tags'&&state.transactions.some(t=>t.tags?.includes(id))){toast('Remove this tag from transactions before deleting it.');return;}deleteConfirm('Delete '+kind+' item?','This removes the unused item.',s=>{s[kind]=s[kind].filter(x=>x.id!==id);if(s.settings.defaultPerson===id)s.settings.defaultPerson='';});},
accounts:accountsView,'account-add':()=>accountForm(),'account-edit':el=>accountForm(el.dataset.id),'transfer-add':()=>transferForm(),'transfer-edit':el=>transferForm(el.dataset.id),'delete-account':el=>{let id=el.dataset.id;if(state.transactions.some(t=>t.account===id)||state.plans.some(p=>p.account===id)||state.transfers.some(t=>t.from===id||t.to===id)){toast('This account is in use. Reassign its records before deleting it.');return;}deleteConfirm('Delete account?','Remove this unused account?',s=>s.accounts=s.accounts.filter(a=>a.id!==id));},'delete-transfer':el=>deleteConfirm('Delete transfer?','This reverses the balance movement on both accounts.',s=>s.transfers=s.transfers.filter(t=>t.id!==el.dataset.id)),

'export-raw':()=>{let raw=localStorage.getItem(key());download('The_Ledger_preserved_data_'+E.today()+'.txt',raw||'No stored data','text/plain');},'blocked-recovery':async()=>{sheet('Recovery snapshots','<p>Looking for recoverable data…</p>');try{let all=await recoveryList();sheet('Recovery snapshots',all.length?all.map(x=>button(new Date(x.date).toLocaleString()+' · Restore','restore-snapshot','list-action',`data-id="${x.id}"`)).join(''):'<p>No recovery snapshots found. Your original stored data remains available to download.</p>');}catch(e){sheet('Recovery unavailable','<p>'+esc(e.message)+'</p>');}},
