<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0C1322" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>The Ledger</title>
<style>
 :root {
   --bg: #0A0F1D;
   --card: #121A2C;
   --card-elevated: #162035;
   --raised: #0A0F1D;
   --hairline: rgba(255, 255, 255, 0.08);
   --hairline-strong: rgba(255, 255, 255, 0.14);
   --text: #F0F4FC;
   --text-muted: #8292B2;
   --accent: #E5B869;
   --accent-ink: #0A0F1D;
   --rust: #E05D44;
   --rust-wash: rgba(224, 93, 68, 0.14);
   --positive: #4ECB8F;
   --positive-wash: rgba(78, 203, 143, 0.14);
   --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.35);
   --shadow-elevated: 0 12px 32px -4px rgba(0, 0, 0, 0.45);
   --f-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
   --f-mono: "SF Mono", Menlo, Consolas, Monaco, monospace;
   --f-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
 }

 * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
 html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior-y: none; background: var(--bg); }
 body { font-family: var(--f-ui); color: var(--text); -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
 #root { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; min-height: var(--vh100, 100dvh); }
 
 .wrap {
   flex: 1 0 auto;
   max-width: 420px;
   width: 100%;
   margin: 0 auto;
   box-sizing: border-box;
   padding: calc(env(safe-area-inset-top, 0px) + 64px) 16px calc(env(safe-area-inset-bottom, 0px) + 92px);
 }

 .app-header-fixed {
   position: fixed;
   top: 0;
   left: 0;
   right: 0;
   height: calc(env(safe-area-inset-top, 0px) + 54px);
   padding-top: env(safe-area-inset-top, 0px);
   backdrop-filter: blur(24px);
   -webkit-backdrop-filter: blur(24px);
   background: rgba(10, 15, 29, 0.78);
   border-bottom: 1px solid var(--hairline);
   z-index: 35;
   display: flex;
   align-items: center;
   justify-content: center;
 }

 .header-inner {
   max-width: 420px;
   width: 100%;
   padding: 0 16px;
   display: flex;
   align-items: center;
   justify-content: space-between;
 }

 .row { display: flex; align-items: center; }
 .between { justify-content: space-between; }
 .col { display: flex; flex-direction: column; }
 .gap2 { gap: 8px; }
 .gap3 { gap: 12px; }
 .display { font-family: var(--f-display); font-weight: 700; letter-spacing: -0.03em; }
 .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
 .eyebrow { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); }
 .muted { color: var(--text-muted); }
 
 .card {
   background: var(--card);
   border: 1px solid var(--hairline);
   border-radius: 18px;
   box-shadow: var(--shadow-card);
   transition: transform 0.15s ease;
 }

 .interactive-card:active { transform: scale(0.985); }

 .icon-btn {
   width: 36px;
   height: 36px;
   border-radius: 999px;
   background: rgba(255, 255, 255, 0.06);
   border: 1px solid var(--hairline);
   display: flex;
   align-items: center;
   justify-content: center;
   color: var(--text);
   transition: all 0.15s ease;
 }
 .icon-btn:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.12); }

 button { font-family: inherit; cursor: pointer; color: inherit; border: none; }
 input, select, textarea { font-family: inherit; color: var(--text); }
 input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.75); }

 .field {
   -webkit-appearance: none;
   appearance: none;
   width: 100%;
   box-sizing: border-box;
   display: block;
   border-radius: 12px;
   padding: 12px 14px;
   background: var(--card-elevated);
   border: 1px solid var(--hairline);
   font-size: 14px;
   color: var(--text);
   transition: border 0.15s ease;
 }
 .field:focus { outline: none; border-color: var(--accent); }

 .btn-accent {
   background: linear-gradient(135deg, #ECC57D 0%, #D8A550 100%);
   color: var(--accent-ink);
   font-weight: 600;
   border-radius: 14px;
   padding: 12px 20px;
   font-size: 14px;
   box-shadow: 0 4px 14px rgba(229, 184, 105, 0.25);
   transition: transform 0.15s ease, opacity 0.15s ease;
 }
 .btn-accent:active { transform: scale(0.97); }
 .btn-accent:disabled { opacity: 0.4; }

 .btn-outline {
   background: var(--card-elevated);
   border: 1px solid var(--hairline-strong);
   color: var(--text);
   font-weight: 500;
   border-radius: 14px;
   padding: 11px 18px;
   font-size: 14px;
   transition: transform 0.15s ease;
 }
 .btn-outline:active { transform: scale(0.97); }

 .btn-rust {
   background: linear-gradient(135deg, #EA684E 0%, #D14F37 100%);
   color: #fff;
   font-weight: 600;
   border-radius: 14px;
   padding: 11px 18px;
   font-size: 14px;
 }
 .btn-rust:active { transform: scale(0.97); }

 .segmented-bar {
   background: rgba(255, 255, 255, 0.05);
   border: 1px solid var(--hairline);
   border-radius: 12px;
   padding: 3px;
   display: flex;
 }
 .segmented-item {
   flex: 1;
   border: none;
   border-radius: 9px;
   padding: 7px 0;
   font-size: 13px;
   font-weight: 500;
   background: transparent;
   color: var(--text-muted);
   transition: all 0.15s ease;
 }
 .segmented-item.active {
   background: var(--card-elevated);
   color: var(--text);
   font-weight: 600;
   box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
 }

 .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
 .hairline-top { border-top: 1px solid var(--hairline); }
 .hairline-bottom { border-bottom: 1px solid var(--hairline); }

 /* Native Bottom Sheet Modal */
 .modal-backdrop {
   position: fixed;
   inset: 0;
   background: rgba(4, 8, 16, 0.65);
   backdrop-filter: blur(8px);
   -webkit-backdrop-filter: blur(8px);
   display: flex;
   align-items: flex-end;
   justify-content: center;
   z-index: 50;
   animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
 }
 @media (min-width: 480px) { .modal-backdrop { align-items: center; } }
 
 .modal-card {
   width: 100%;
   max-width: 420px;
   max-height: 88vh;
   overflow-y: auto;
   background: var(--card);
   border: 1px solid var(--hairline-strong);
   border-radius: 26px 26px 0 0;
   padding: 12px 20px 24px;
   box-shadow: var(--shadow-elevated);
   animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
 }
 @media (min-width: 480px) { .modal-card { border-radius: 24px; } }

 .modal-handle {
   width: 40px;
   height: 5px;
   background: rgba(255, 255, 255, 0.18);
   border-radius: 999px;
   margin: 4px auto 14px;
 }

 @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
 @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

 .pill-scroll {
   display: flex;
   gap: 6px;
   overflow-x: auto;
   scrollbar-width: none;
   -ms-overflow-style: none;
   padding-bottom: 4px;
   margin-bottom: 12px;
 }
 .pill-scroll::-webkit-scrollbar { display: none; }
 .pill-btn {
   white-space: nowrap;
   font-size: 12px;
   font-weight: 500;
   border-radius: 999px;
   padding: 7px 14px;
   border: 1px solid var(--hairline);
   background: rgba(255, 255, 255, 0.04);
   color: var(--text-muted);
   transition: all 0.15s ease;
 }
 .pill-btn:active { transform: scale(0.94); }
 .pill-btn.active {
   background: var(--accent);
   color: var(--accent-ink);
   font-weight: 600;
   border-color: var(--accent);
   box-shadow: 0 2px 10px rgba(229, 184, 105, 0.3);
 }

 .interactive-subcard {
   background: rgba(0, 0, 0, 0.25);
   border: 1px solid var(--hairline);
   border-radius: 14px;
   padding: 12px 14px;
   margin-top: 10px;
 }
 .reorder-bar {
   background: rgba(229, 184, 105, 0.08);
   border: 1px dashed var(--accent);
   border-radius: 12px;
   padding: 8px 12px;
   margin-bottom: 10px;
 }
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";

/* ---------------- Constants & Default Settings ---------------- */
var STORAGE_KEY = "ledger-data";
var TEST_KEY = "ledger-selftest";
var DEFAULT_SETTINGS = {
  weeklyTarget: 1800,
  theme: "dark",
  trackingStartDate: null,
  categories: ["Food & Dining", "Groceries", "Transport", "Shopping", "Bills & Utilities", "Health", "Entertainment", "Other"],
  rateHistory: null,
  analysisSectionOrder: null
};

var DEFAULT_ANALYSIS_ORDER = [
  "summary",
  "dailySpend",
  "dailySaving",
  "monthlyBar",
  "category",
  "dow",
  "topTransactions"
];

var ANALYSIS_SECTION_LABELS = {
  summary: "Summary Metrics",
  dailySpend: "Spend per day (Columns)",
  dailySaving: "Saved per day (Columns)",
  monthlyBar: "Monthly spend vs target",
  category: "Spend by category",
  dow: "Average by day of week",
  topTransactions: "Biggest transactions"
};

function normalizeAnalysisOrder(order) {
  var out = (order || []).filter(function(id){ return DEFAULT_ANALYSIS_ORDER.indexOf(id) !== -1; });
  DEFAULT_ANALYSIS_ORDER.forEach(function(id){ if (out.indexOf(id) === -1) out.push(id); });
  return out;
}

var PALETTES = {
  dark: {
    bg: "#0A0F1D", card: "#121A2C", cardElevated: "#162035", raised: "#0A0F1D",
    hairline: "rgba(255, 255, 255, 0.08)", text: "#F0F4FC", textMuted: "#8292B2",
    accent: "#E5B869", accentInk: "#0A0F1D", rust: "#E05D44", rustWash: "rgba(224, 93, 68, 0.14)",
    positive: "#4ECB8F", positiveWash: "rgba(78, 203, 143, 0.14)"
  },
  light: {
    bg: "#F2F5FA", card: "#FFFFFF", cardElevated: "#F8FAFD", raised: "#F2F5FA",
    hairline: "rgba(0, 0, 0, 0.06)", text: "#141D33", textMuted: "#6B7B99",
    accent: "#AF7E26", accentInk: "#FFFFFF", rust: "#C6462C", rustWash: "rgba(198, 70, 44, 0.08)",
    positive: "#1B8C58", positiveWash: "rgba(27, 140, 88, 0.08)"
  }
};

function toStr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseD(s){ return new Date(s+"T00:00:00"); }
function todayStr(){ return toStr(new Date()); }
function minStr(a,b){ return a<b?a:b; }
function round2(n){ return Math.round(n*100)/100; }
function startOfWeek(d){
  var x = new Date(d.getFullYear(),d.getMonth(),d.getDate());
  var day = x.getDay();
  var back = day===0?6:day-1;
  x.setDate(x.getDate()-back);
  return x;
}
function addDays(d,n){ var x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function addMonths(d,n){ return new Date(d.getFullYear(), d.getMonth()+n, 1); }
function endOfMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0); }
function daysInMonth(d){ return endOfMonth(d).getDate(); }
function daysBetween(aStr,bStr){ return Math.round((parseD(bStr)-parseD(aStr))/86400000); }
function fmt(n, dp){
  dp = (dp === undefined || dp === null) ? 0 : dp;
  return (Number(n)||0).toLocaleString("en-US", {minimumFractionDigits:dp, maximumFractionDigits:dp});
}
function dayLabel(s){ return parseD(s).toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short"}); }
function shortLabel(s){ return parseD(s).toLocaleDateString("en-GB", {day:"numeric", month:"short"}); }
function weekdayLong(s){ return parseD(s).toLocaleDateString("en-GB", {weekday:"long"}); }
function sumSpent(e){ return (e && Array.isArray(e.items)) ? e.items.reduce(function(s,i){ return s+i.amount; },0) : 0; }
function itemTimeKey(it){ var n = parseInt(String(it.id).split("-")[0], 10); return isNaN(n) ? 0 : n; }
function newestFirst(items){ return items.slice().sort(function(a,b){ return itemTimeKey(b) - itemTimeKey(a); }); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function getPeriodBounds(viewType, off, weeklyTarget, dailyAllowanceVal) {
  var now = new Date();
  var tsd = state.settings.trackingStartDate;
  function clippedTarget(startStr, endStr, fullTarget) {
    var s = (tsd && tsd > startStr) ? tsd : startStr;
    if (s > endStr) return 0;
    var sum = 0;
    var cur = parseD(s);
    while (toStr(cur) <= endStr) { sum += allowanceForDate(toStr(cur)); cur = addDays(cur,1); }
    return sum;
  }
  if (viewType === "week") {
    var start = addDays(startOfWeek(now), off*7);
    var end = addDays(start, 6);
    var title = (start.getMonth()===end.getMonth())
      ? (start.getDate()+"–"+end.getDate()+" "+end.toLocaleDateString("en-GB",{month:"long",year:"numeric"}))
      : (shortLabel(toStr(start))+" – "+shortLabel(toStr(end)));
    return {
      startStr: toStr(start), endStr: toStr(end), days: 7,
      target: clippedTarget(toStr(start), toStr(end), weeklyTarget),
      title: title,
      sub: off===0 ? "This week" : off===-1 ? "Last week" : (Math.abs(off)+" weeks ago")
    };
  }
  if (viewType === "month") {
    var mstart = addMonths(startOfMonth(now), off);
    var mend = endOfMonth(mstart);
    var dim = daysInMonth(mstart);
    return {
      startStr: toStr(mstart), endStr: toStr(mend), days: dim,
      target: clippedTarget(toStr(mstart), toStr(mend), dailyAllowanceVal*dim),
      title: mstart.toLocaleDateString("en-GB",{month:"long",year:"numeric"}),
      sub: off===0 ? "This month" : off===-1 ? "Last month" : (Math.abs(off)+" months ago")
    };
  }
  var y = now.getFullYear() + off;
  var ystart = new Date(y,0,1);
  var yend = new Date(y,11,31);
  var ydays = Math.round((yend-ystart)/86400000)+1;
  return {
    startStr: toStr(ystart), endStr: toStr(yend), days: ydays,
    target: clippedTarget(toStr(ystart), toStr(yend), dailyAllowanceVal*ydays),
    title: String(y),
    sub: off===0 ? "This year" : off===-1 ? "Last year" : (Math.abs(off)+" years ago")
  };
}

function migrateEntries(raw, fallbackAllowance) {
  var out = {};
  for (var date in (raw||{})) {
    var e = raw[date];
    if (e && Array.isArray(e.items)) out[date] = e;
    else if (e && typeof e.spent === "number") out[date] = { allowance: (e.allowance==null?fallbackAllowance:e.allowance), items: [{ id:"legacy-"+date, amount:e.spent, note:"" }] };
  }
  return out;
}

/* ---------------- Application State ---------------- */
var state = {
  settings: DEFAULT_SETTINGS,
  entries: {},
  loading: true,
  saveError: null,
  storageOK: null,
  view: "week",
  offset: 0,
  showSettings: false,
  showBackup: false,
  showResetConfirm: false,
  restoreError: null,
  page: "home",
  calendarOffset: 0,
  calendarSelectedDate: null,
  editingItemId: null,
  editingOriginalDate: null,
  showAddTxn: false,
  toastMessage: null,
  settingsTab: "budget",
  pendingDeleteKey: null,
  txnCategoryFilter: "",
  txnPeriodMode: "all",
  txnPeriodDate: "",
  txnPeriodFrom: "",
  txnPeriodTo: "",

  // Interactive Analytics
  analysisPeriodMode: "thisMonth",
  analysisPeriodDate: "",
  analysisPeriodFrom: "",
  analysisPeriodTo: "",
  analysisReorderMode: false,
  analysisSelectedDate: null,
  analysisSelectedCategory: null,
  analysisSelectedDow: null,
  analysisTopLimit: 5
};

function rateForDate(ds) {
  var hist = state.settings.rateHistory;
  if (!hist || !hist.length) return state.settings.weeklyTarget;
  var rate = hist[0].weeklyTarget;
  for (var i=0;i<hist.length;i++) {
    if (hist[i].from <= ds) rate = hist[i].weeklyTarget; else break;
  }
  return rate;
}
function currentWeeklyTarget(){ return rateForDate(todayStr()); }
function dailyAllowance(){ return currentWeeklyTarget()/7; }

function allowanceForDate(ds) {
  var e = state.entries[ds];
  if (e && typeof e.allowance === "number") return e.allowance;
  return rateForDate(ds)/7;
}

function normalizeRateHistory(hist) {
  var out = (hist||[]).slice().sort(function(a,b){ return a.from < b.from ? -1 : a.from > b.from ? 1 : 0; });
  var dedup = [];
  for (var i=0;i<out.length;i++) {
    if (dedup.length && dedup[dedup.length-1].from === out[i].from) dedup[dedup.length-1] = out[i];
    else if (dedup.length && dedup[dedup.length-1].weeklyTarget === out[i].weeklyTarget) continue;
    else dedup.push(out[i]);
  }
  return dedup;
}

function loadInitial() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      state.settings = Object.assign({}, DEFAULT_SETTINGS, parsed.settings||{});
      if (!state.settings.rateHistory || !state.settings.rateHistory.length) {
        state.settings.rateHistory = [{ from: "1900-01-01", weeklyTarget: state.settings.weeklyTarget }];
      }
      state.entries = migrateEntries(parsed.entries||{}, dailyAllowance());
    }
  } catch(e) { /* first run */ }
  if (!state.settings.rateHistory || !state.settings.rateHistory.length) {
    state.settings.rateHistory = [{ from: "1900-01-01", weeklyTarget: state.settings.weeklyTarget }];
  }
  state.settings.analysisSectionOrder = normalizeAnalysisOrder(state.settings.analysisSectionOrder);
  state.loading = false;
  try {
    localStorage.setItem(TEST_KEY, "1");
    var ok = localStorage.getItem(TEST_KEY) === "1";
    localStorage.removeItem(TEST_KEY);
    state.storageOK = ok;
  } catch(e) { state.storageOK = false; }
}

function persistAll(nextSettings, nextEntries, label) {
  state.settings = nextSettings;
  state.entries = nextEntries;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ settings: nextSettings, entries: nextEntries }));
    state.saveError = null;
  } catch(e) {
    state.saveError = { nextSettings: nextSettings, nextEntries: nextEntries, label: label };
  }
}

function periodStats(startStr, endStrRaw) {
  var endStr = minStr(endStrRaw, todayStr());
  var opening = 0;
  var tsd = state.settings.trackingStartDate;
  var effectiveStart = (tsd && tsd > startStr) ? tsd : startStr;
  var rows = [];
  if (effectiveStart <= endStr) {
    var cur = parseD(effectiveStart);
    while (toStr(cur) <= endStr) {
      var ds = toStr(cur);
      var e = state.entries[ds];
      rows.push({ date: ds, logged: !!e, items: e ? e.items : [], spent: e ? sumSpent(e) : 0, allowance: allowanceForDate(ds) });
      cur = addDays(cur, 1);
    }
  }
  var net = round2(rows.reduce(function(s,r){ return s+(r.allowance-r.spent); },0));
  var closing = round2(opening+net);
  var calendarElapsedDays = (startStr <= endStr) ? (daysBetween(startStr, endStr) + 1) : 0;
  return {
    opening:opening, net:net, closing:closing, rows:rows, elapsedDays: rows.length, calendarElapsedDays: calendarElapsedDays,
    loggedCount: rows.filter(function(r){return r.logged;}).length, spent: rows.reduce(function(s,r){return s+r.spent;},0)
  };
}

function computeDailyBudgetLeft(viewType, spentTodayVal) {
  var da_ = dailyAllowance();
  var per = getPeriodBounds(viewType, 0, currentWeeklyTarget(), da_);
  var stats = periodStats(per.startStr, per.endStr);
  var daysLeftLocal = Math.max(0, per.days - stats.calendarElapsedDays);
  if (daysLeftLocal <= 0) return null;
  var planDaysLocal = daysLeftLocal + 1;
  var spentBeforeTodayLocal = stats.spent - spentTodayVal;
  var remainingExclToday = per.target - spentBeforeTodayLocal;
  return { value: remainingExclToday/planDaysLocal, planDays: planDaysLocal, daysLeft: daysLeftLocal };
}

/* ---------------- Charts (Hardware-Accelerated SVGs) ---------------- */
function renderChart(data, T) {
  var w=340,h=220,padL=40,padR=8,padT=12,padB=24;
  var values = data.map(function(d){return d.balance;});
  var min = Math.min.apply(null,[0].concat(values)), max = Math.max.apply(null,[0].concat(values));
  var range = (max-min)||1;
  var plotW=w-padL-padR, plotH=h-padT-padB;
  function x(i){ return padL + (data.length>1 ? (i/(data.length-1))*plotW : plotW/2); }
  function y(v){ return padT + plotH - ((v-min)/range)*plotH; }
  var linePts = data.map(function(d,i){ return x(i)+","+y(d.balance); }).join(" ");
  var areaPts = x(0)+","+y(0)+" "+linePts+" "+x(data.length-1)+","+y(0);
  var ticksSet = {}; [max,min,0].forEach(function(t){ ticksSet[Math.round(t)] = true; });
  var ticks = Object.keys(ticksSet).map(Number);
  var tickSvg = ticks.map(function(t){
    return '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="'+T.hairline+'" stroke-dasharray="3,3"/>'
      + '<text x="2" y="'+(y(t)+3)+'" font-size="9" fill="'+T.textMuted+'" font-family="var(--f-mono)">'+fmt(t)+'</text>';
  }).join("");
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none">'
    + tickSvg
    + '<polygon points="'+areaPts+'" fill="'+T.accent+'" fill-opacity="0.16"/>'
    + '<polyline points="'+linePts+'" fill="none" stroke="'+T.accent+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'
    + '<text x="'+x(0)+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'">'+esc(data[0].label)+'</text>'
    + '<text x="'+x(data.length-1)+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'" text-anchor="end">'+esc(data[data.length-1].label)+'</text>'
    + '</svg>';
}

/* ---------------- Theme & Lock ---------------- */
function applyTheme(T) {
  var r = document.documentElement.style;
  r.setProperty("--bg", T.bg);
  r.setProperty("--card", T.card);
  r.setProperty("--card-elevated", T.cardElevated);
  r.setProperty("--raised", T.raised);
  r.setProperty("--hairline", T.hairline);
  r.setProperty("--text", T.text);
  r.setProperty("--text-muted", T.textMuted);
  r.setProperty("--accent", T.accent);
  r.setProperty("--accent-ink", T.accentInk);
  r.setProperty("--rust", T.rust);
  r.setProperty("--rust-wash", T.rustWash);
  r.setProperty("--positive", T.positive);
}

var bodyScrollLocked = false;
var lockedScrollY = 0;
function lockBodyScroll() {
  if (bodyScrollLocked) return;
  lockedScrollY = window.scrollY || window.pageYOffset || 0;
  document.body.style.position = "fixed";
  document.body.style.top = (-lockedScrollY) + "px";
  document.body.style.left = "0"; document.body.style.right = "0"; document.body.style.width = "100%";
  bodyScrollLocked = true;
}
function unlockBodyScroll() {
  if (!bodyScrollLocked) return;
  document.body.style.position = ""; document.body.style.top = ""; document.body.style.left = ""; document.body.style.right = ""; document.body.style.width = "";
  bodyScrollLocked = false;
  window.scrollTo(0, lockedScrollY);
}

/* ---------------- Main Render Dispatcher ---------------- */
function render() {
  var root = document.getElementById("root");
  var T = PALETTES[state.settings.theme] || PALETTES.dark;
  applyTheme(T);
  var anyModalOpen = state.showAddTxn || state.showSettings || state.showBackup || state.showResetConfirm;
  if (anyModalOpen) lockBodyScroll(); else unlockBodyScroll();
  if (state.loading) {
    root.innerHTML = '<div class="row" style="min-height:100vh; align-items:center; justify-content:center;"><div class="muted" style="font-size:14px; font-weight:500;">Loading Ledger…</div></div>';
    return;
  }
  var da = dailyAllowance();
  var html = "";

  // Floating iOS Header
  html += '<header class="app-header-fixed">';
  html += '<div class="header-inner">';
  html += '<div><div class="display" style="font-size:18px;">The Ledger</div><div class="muted mono" style="font-size:10px; margin-top:1px;">'+fmt(da,0)+' AED/day · Mon–Sun</div></div>';
  html += '<div class="row gap2">';
  html += '<button class="icon-btn" data-action="toggle-theme" aria-label="Toggle theme">'+(state.settings.theme==="dark"?ICONS.sun:ICONS.moon)+'</button>';
  html += '<button class="icon-btn" data-action="open-settings" aria-label="Settings">'+ICONS.settings+'</button>';
  html += '</div></div></header>';

  html += '<div class="wrap">';
  if (state.storageOK === false) {
    html += '<div class="card" style="padding:12px 16px; margin-bottom:14px; display:flex; gap:12px; background:var(--rust-wash); border-color:var(--rust);">';
    html += '<div style="flex-shrink:0; color:var(--rust);">'+ICONS.alert+'</div>';
    html += '<div><div style="font-size:12px; font-weight:500;">Browser is blocking local storage.</div>';
    html += '<button data-action="open-backup" style="background:none;border:none;padding:0;text-decoration:underline;color:var(--rust);font-size:12px;margin-top:2px;">Open backup tool</button></div></div>';
  }

  if (state.page === "transactions") html += renderTransactionsBody();
  else if (state.page === "calendar") html += renderCalendarBody();
  else if (state.page === "analysis") html += renderAnalysisBody(T);
  else html += renderHomeBody(T, da);

  if (state.saveError) {
    html += '<div style="text-align:center; margin-top:14px; font-size:12px; color:var(--rust);">Could not save '+esc(state.saveError.label)+' — <button data-action="retry-save" style="background:none;border:none;padding:0;text-decoration:underline;color:var(--rust);font-size:12px;">retry</button>.</div>';
  }
  html += '</div>';

  if (state.page === "home" || state.page === "transactions" || state.page === "calendar") html += renderFab();
  html += renderBottomNav();

  // Modals
  if (state.showAddTxn) html += renderAddTxnModal();
  if (state.showSettings) html += renderSettingsModal();
  if (state.showBackup) html += renderBackupModal();
  if (state.showResetConfirm) html += renderResetConfirmModal();

  if (state.toastMessage) {
    html += '<div style="position:fixed; top:calc(env(safe-area-inset-top,0px) + 62px); left:50%; transform:translateX(-50%); background:var(--positive); color:#0A0F1D; font-size:13px; font-weight:600; padding:8px 18px; border-radius:999px; box-shadow:0 8px 24px rgba(0,0,0,0.4); z-index:70; animation:slideUp 0.2s ease;">'+esc(state.toastMessage)+'</div>';
  }
  root.innerHTML = html;
}

/* ---------------- Home Page ---------------- */
function renderHomeBody(T, da) {
  var period = getPeriodBounds(state.view, state.offset, state.settings.weeklyTarget, da);
  var displayed = periodStats(period.startStr, period.endStr);
  var isClosed = period.endStr < todayStr();
  var isCurrent = state.offset === 0;
  var daysLeft = Math.max(0, period.days - displayed.calendarElapsedDays);
  var elapsedTarget = displayed.elapsedDays * da;
  var chartData = displayed.rows.length ? (function(){
    var acc = displayed.opening;
    return displayed.rows.map(function(r){ acc = round2(acc + (r.allowance-r.spent)); return { label: shortLabel(r.date), balance: acc }; });
  })() : [];
  var netColor = displayed.net >= 0 ? "var(--positive)" : "var(--rust)";
  var entryDates = Object.keys(state.entries).sort();
  var cumAnchor = state.settings.trackingStartDate || (entryDates.length ? entryDates[0] : todayStr());
  var cumulative = periodStats(cumAnchor, todayStr());
  var cumColor = cumulative.net >= 0 ? "var(--positive)" : "var(--rust)";
  var cumLabel = "Saved since " + parseD(cumAnchor).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
  var todayEntryForCard = state.entries[todayStr()];
  var spentToday = todayEntryForCard ? sumSpent(todayEntryForCard) : 0;
  var spentTodayColor = spentToday > da ? "var(--rust)" : "var(--text)";
  var todayAllowanceForCard = allowanceForDate(todayStr());

  var weekDBL = computeDailyBudgetLeft("week", spentToday);
  var monthDBL = computeDailyBudgetLeft("month", spentToday);
  var capCandidates = [todayAllowanceForCard];
  if (weekDBL) capCandidates.push(weekDBL.value);
  if (monthDBL) capCandidates.push(monthDBL.value);
  var effectiveDailyCap = Math.min.apply(null, capCandidates);
  var leftToday = effectiveDailyCap - spentToday;
  var leftTodayColor = leftToday < 0 ? "var(--rust)" : "var(--positive)";
  var leftTodayBudget = todayAllowanceForCard - spentToday;
  var leftTodayBudgetColor = leftTodayBudget < 0 ? "var(--rust)" : "var(--positive)";

  var h = "";
  // Rounded Top Metrics Card
  h += '<div class="card" style="padding:16px 18px; margin-bottom:14px;">';
  h += '<div class="row between"><span class="eyebrow">Left to spend today</span><span class="mono" style="font-size:17px; font-weight:600; color:'+leftTodayColor+';">'+fmt(Math.round(leftToday),0)+' AED</span></div>';
  h += '<div class="row between" style="margin-top:12px;"><span class="eyebrow">Left to spend today (budget)</span><span class="mono" style="font-size:17px; font-weight:600; color:'+leftTodayBudgetColor+';">'+fmt(Math.round(leftTodayBudget),0)+' AED</span></div>';
  h += '<div class="row between" style="margin-top:12px;"><span class="eyebrow">Spent today</span><span class="mono" style="font-size:17px; font-weight:600; color:'+spentTodayColor+';">'+fmt(Math.round(spentToday),0)+' AED</span></div>';
  h += '<div class="row between" style="margin-top:12px;"><span class="eyebrow">'+esc(cumLabel)+'</span><span class="mono" style="font-size:17px; font-weight:600; color:'+cumColor+';">'+(cumulative.net>=0?"+":"−")+fmt(Math.round(Math.abs(cumulative.net)),0)+' AED</span></div>';
  h += '</div>';

  // Segmented Horizon Selector
  h += '<div class="segmented-bar" style="margin-bottom:14px;">';
  ["week","month","year"].forEach(function(v){
    var active = state.view===v;
    h += '<button data-action="switch-view" data-view="'+v+'" class="segmented-item '+(active?'active':'')+'" style="text-transform:capitalize;">'+v+'</button>';
  });
  h += '</div>';

  // Period Detail Card
  h += '<div class="card" style="margin-bottom:16px; overflow:hidden;">';
  h += '<div class="row between" style="padding:14px 16px; border-bottom:1px solid var(--hairline);">';
  h += '<button data-action="nav-offset" data-delta="-1" class="icon-btn" aria-label="Previous">'+ICONS.chevronLeft+'</button>';
  h += '<div style="text-align:center;"><div style="font-size:15px; font-weight:600;">'+esc(period.title)+'</div>';
  h += '<div class="eyebrow" style="margin-top:3px;">'+esc(period.sub)+(isClosed?" · closed":"")+' · Budget '+fmt(period.target,0)+' AED</div>';
  if (isCurrent) {
    h += '<div class="muted" style="font-size:11px; margin-top:3px;">'+(state.view==="week"?esc(weekdayLong(todayStr()))+" · ":"")+'Day '+displayed.calendarElapsedDays+' of '+period.days+' · '+daysLeft+' day'+(daysLeft===1?"":"s")+' left</div>';
  }
  h += '</div>';
  h += '<button data-action="nav-offset" data-delta="1" class="icon-btn" style="'+(isCurrent?"opacity:0.3;pointer-events:none;":"")+'" aria-label="Next">'+ICONS.chevronRight+'</button>';
  h += '</div>';

  h += '<div style="padding:18px 20px 14px;">';
  h += '<div class="eyebrow">'+(isClosed?"Saved this period":"Saved so far")+'</div>';
  h += '<div class="mono" style="font-size:36px; font-weight:700; margin-top:4px; color:'+netColor+';">'+(displayed.net>=0?"+":"−")+fmt(Math.abs(displayed.net),0)+' <span class="muted" style="font-size:18px; font-weight:400;">AED</span></div>';
  h += '<div class="muted" style="font-size:12px; margin-top:4px;">'+(displayed.elapsedDays===0 ? ("This "+state.view+" hasn't started yet") : (displayed.loggedCount+" of "+displayed.elapsedDays+" elapsed day"+(displayed.elapsedDays===1?"":"s")+" logged"))+'</div>';
  h += '</div>';

  var todayIncluded = displayed.rows.length > 0 && displayed.rows[displayed.rows.length-1].date === todayStr();
  var todaySpent = todayIncluded ? displayed.rows[displayed.rows.length-1].spent : 0;
  var pastDays = todayIncluded ? displayed.elapsedDays - 1 : displayed.elapsedDays;
  var pastSpent = displayed.spent - todaySpent;
  var avgSpentPerDay = pastDays > 0 ? (pastSpent/pastDays) : null;
  var remainingBudget = period.target - displayed.spent;
  var allowedText, allowedTone, planDaysShown;
  if (daysLeft > 0) {
    planDaysShown = daysLeft + 1;
    var spentBeforeToday = displayed.spent - spentToday;
    var remainingExclToday = period.target - spentBeforeToday;
    var perDayLeft = remainingExclToday/planDaysShown;
    allowedText = fmt(perDayLeft,0)+" AED";
    allowedTone = perDayLeft < 0 ? "var(--rust)" : "var(--text)";
  } else {
    allowedText = isClosed ? "—" : "Last day";
    allowedTone = "var(--text-muted)";
  }

  h += '<div class="stat-grid hairline-top" style="padding:14px 20px 16px;">';
  h += statBlock("Spent so far", fmt(displayed.spent,0)+" AED", displayed.spent>elapsedTarget?"var(--rust)":"var(--text)");
  h += statBlock("Budget remaining", (remainingBudget>=0?"":"−")+fmt(Math.abs(remainingBudget),0)+" AED", remainingBudget<0?"var(--rust)":"var(--text)");
  h += statBlock("Avg daily spend", avgSpentPerDay===null ? "—" : (fmt(avgSpentPerDay,0)+" AED"), (avgSpentPerDay!==null && avgSpentPerDay>da)?"var(--rust)":"var(--text)");
  h += statBlock("Daily budget left"+(daysLeft>0?" ("+planDaysShown+"d)":""), allowedText, allowedTone);
  h += '</div>';

  if (chartData.length >= 2) {
    h += '<div class="hairline-top" style="padding:14px 10px 12px;">'+renderChart(chartData, T)+'</div>';
  }
  h += '</div>';

  if (isCurrent && daysLeft > 0 && avgSpentPerDay !== null) {
    var pacePerDay = avgSpentPerDay;
    var projectedSpend = displayed.spent + pacePerDay * daysLeft;
    var projectedSaved = period.target - projectedSpend;
    var onTrack = projectedSaved >= 0;
    h += '<div class="card" style="padding:16px 18px; margin-bottom:16px;">';
    h += '<div class="eyebrow" style="margin-bottom:3px;">Forecast at '+(state.view==="week"?"week":state.view==="month"?"month":"year")+' close</div>';
    h += '<div class="muted" style="font-size:11px; margin-bottom:14px;">Based on your '+fmt(pacePerDay,0)+' AED/day average for '+daysLeft+' remaining day'+(daysLeft===1?"":"s")+'</div>';
    h += '<div class="stat-grid">';
    h += statBlock("Projected spend", fmt(projectedSpend,0)+" AED", projectedSpend>period.target?"var(--rust)":"var(--text)");
    h += statBlock("Projected saved", (projectedSaved>=0?"+":"−")+fmt(Math.abs(projectedSaved),0)+" AED", onTrack?"var(--positive)":"var(--rust)");
    h += '</div>';
    h += '<div style="margin-top:12px; font-size:12px; font-weight:500; color:'+(onTrack?"var(--positive)":"var(--rust)")+';">'+(onTrack?"✓ On track to finish under budget":"⚠ On track to overshoot — ease off to recover")+'</div>';
    h += '</div>';
  }
  return h;
}

  "Groceries": { icon:"basket", color:"#53A853" },

function categoryStyle(name) {
  if (!name) return { icon:"tag", color:"#8292B2" };
  if (CATEGORY_STYLES[name]) return CATEGORY_STYLES[name];
  var hash = 0;
  for (var i=0;i<name.length;i++) hash = (hash*31 + name.charCodeAt(i)) >>> 0;
  return { icon:"tag", color: PIE_COLORS[hash % PIE_COLORS.length] };
}

function catIconCircle(categoryName) {
  var st = categoryStyle(categoryName);
  return '<span style="width:34px; height:34px; border-radius:50%; background:'+st.color+'; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 3px 10px rgba(0,0,0,0.25);">'+CAT_ICON_SVGS[st.icon]+'</span>';
}

/* ---------------- Interactive Column & Donut Charts ---------------- */
function renderInteractiveDonut(slices, T, selectedCat) {
  var size = 180, r = 76, cx = size/2, cy = size/2;
  var total = slices.reduce(function(s,x){ return s+x.value; }, 0);
  if (total <= 0) return "";
  var angle = -Math.PI/2;
  var paths = "";
  slices.forEach(function(sl, i){
    var frac = sl.value/total;
    var sweep = frac * Math.PI * 2;
    var end = angle + sweep;
    var color = PIE_COLORS[i % PIE_COLORS.length];
    var isSel = (selectedCat && selectedCat === sl.label);
    var segR = isSel ? r + 3 : r;
    var strokeStyle = isSel ? ' stroke="#FFFFFF" stroke-width="2.5"' : '';

    if (frac >= 0.9999) {
      paths += '<circle cx="'+cx+'" cy="'+cy+'" r="'+segR+'" fill="'+color+'"'+strokeStyle+' data-action="analysis-select-cat" data-cat="'+esc(sl.label)+'" style="cursor:pointer;" />';
    } else {
      var x1 = cx + segR*Math.cos(angle), y1 = cy + segR*Math.sin(angle);
      var x2 = cx + segR*Math.cos(end), y2 = cy + segR*Math.sin(end);
      var large = sweep > Math.PI ? 1 : 0;
      paths += '<path d="M '+cx+' '+cy+' L '+x1+' '+y1+' A '+segR+' '+segR+' 0 '+large+' 1 '+x2+' '+y2+' Z" fill="'+color+'"'+strokeStyle+' data-action="analysis-select-cat" data-cat="'+esc(sl.label)+'" style="cursor:pointer; transition: transform 0.15s ease;" />';
    }
    angle = end;
  });
  paths += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*0.58)+'" fill="'+T.card+'" pointer-events="none" />';
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+paths+'</svg>';
}

function renderBarChart(items, T) {
  var w = 340, h = 140, padL = 30, padR = 8, padT = 10, padB = 20;
  var maxVal = Math.max.apply(null, items.map(function(i){ return Math.max(i.spent, i.target); }).concat([1]));
  var plotW = w-padL-padR, plotH = h-padT-padB;
  var n = items.length;
  var slot = plotW/n;
  var barW = Math.min(22, slot*0.55);
  function y(v){ return padT + plotH - (Math.min(v,maxVal)/maxVal)*plotH; }
  var bars = items.map(function(it,i){
    var cx = padL + slot*i + slot/2;
    var barTopY = y(it.spent);
    var barH = Math.max(0, plotH - (barTopY-padT));
    var color = it.spent <= it.target ? T.positive : T.rust;
    var targetY = y(it.target);
    return '<rect x="'+(cx-barW/2)+'" y="'+barTopY+'" width="'+barW+'" height="'+barH+'" fill="'+color+'" rx="3"/>'
      + '<line x1="'+(cx-barW/2-2)+'" x2="'+(cx+barW/2+2)+'" y1="'+targetY+'" y2="'+targetY+'" stroke="'+T.textMuted+'" stroke-dasharray="2,2"/>'
      + '<text x="'+cx+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'" text-anchor="middle">'+esc(it.label)+'</text>';
  }).join("");
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">'
    + '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="'+T.hairline+'"/>'
    + bars + '</svg>';
}

function renderDailyBarChart(rows, getValue, getColor, T, selectedDate) {
  if (!rows.length) return '<div class="muted" style="font-size:12px; padding:12px 0;">No transactions in this period.</div>';
  var w = 340, h = 145, padL = 34, padR = 10, padT = 12, padB = 22;
  var values = rows.map(getValue);
  var maxVal = Math.max.apply(null, values.concat([0]));
  var minVal = Math.min.apply(null, values.concat([0]));
  var range = (maxVal - minVal) || 1;
  var plotW = w-padL-padR, plotH = h-padT-padB;
  var n = rows.length;
  var slot = plotW/n;
  var barW = Math.max(2.5, Math.min(18, slot*0.74));
  function y(v){ return padT + plotH - ((v-minVal)/range)*plotH; }
  var zeroY = y(0);

  var bars = rows.map(function(r,i){
    var v = getValue(r);
    var cx = padL + slot*i + slot/2;
    var top = v>=0 ? y(v) : zeroY;
    var barH = Math.max(2, Math.abs(y(v)-zeroY));
    var isSel = (selectedDate && selectedDate === r.date);
    var stroke = isSel ? ' stroke="#FFFFFF" stroke-width="2.2"' : '';

    return '<g data-action="analysis-select-day" data-date="'+r.date+'" style="cursor:pointer;">'
      + '<rect x="'+(cx-slot/2)+'" y="'+padT+'" width="'+slot+'" height="'+plotH+'" fill="transparent" />'
      + '<rect x="'+(cx-barW/2)+'" y="'+top+'" width="'+barW+'" height="'+barH+'" fill="'+getColor(r,v)+'" rx="2.5"'+stroke+' />'
      + '</g>';
  }).join("");

  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">'
    + '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+zeroY+'" y2="'+zeroY+'" stroke="'+T.hairline+'" stroke-width="1.5"/>'
    + (minVal < 0 ? '<text x="2" y="'+(zeroY+3)+'" font-size="8" fill="'+T.textMuted+'" font-family="var(--f-mono)">0</text>' : '')
    + (maxVal > 0 ? '<text x="2" y="'+(y(maxVal)+3)+'" font-size="8" fill="'+T.textMuted+'" font-family="var(--f-mono)">'+fmt(maxVal,0)+'</text>' : '')
    + bars
    + '<text x="'+padL+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'">'+esc(shortLabel(rows[0].date))+'</text>'
    + '<text x="'+(w-padR)+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'" text-anchor="end">'+esc(shortLabel(rows[rows.length-1].date))+'</text>'
    + '</svg>';
}

/* ---------------- Analysis Page ---------------- */
function getAnalysisPeriodBounds() {
  var today = todayStr();
  var now = new Date();
  var tsd = state.settings.trackingStartDate;
  var entryDatesAll = Object.keys(state.entries).sort();
  var naturalAnchor = tsd || (entryDatesAll.length ? entryDatesAll[0] : today);
  var mode = state.analysisPeriodMode || "thisMonth";
  var anchor = state.analysisPeriodDate || today;
  var from = state.analysisPeriodFrom || "";
  var to = state.analysisPeriodTo || "";

  if (mode === "thisWeek") {
    var sw = startOfWeek(now);
    return { start: toStr(sw), end: toStr(addDays(sw,6)), title: "This Week" };
  }
  if (mode === "thisMonth") {
    var sm = startOfMonth(now);
    return { start: toStr(sm), end: toStr(endOfMonth(sm)), title: sm.toLocaleDateString("en-GB",{month:"long",year:"numeric"}) };
  }
  if (mode === "last30") {
    var s30 = addDays(now, -29);
    return { start: toStr(s30), end: today, title: "Last 30 Days" };
  }
  if (mode === "thisYear") {
    var sy = new Date(now.getFullYear(),0,1);
    var ey = new Date(now.getFullYear(),11,31);
    return { start: toStr(sy), end: toStr(ey), title: String(now.getFullYear()) };
  }
  if (mode === "week" && anchor) {
    var s = startOfWeek(parseD(anchor));
    return { start: toStr(s), end: toStr(addDays(s,6)), title: shortLabel(toStr(s))+' – '+shortLabel(toStr(addDays(s,6))) };
  }
  if (mode === "month" && anchor) {
    var s2 = startOfMonth(parseD(anchor));
    return { start: toStr(s2), end: toStr(endOfMonth(s2)), title: s2.toLocaleDateString("en-GB",{month:"long",year:"numeric"}) };
  }
  if (mode === "range") {
    var sR = from || naturalAnchor;
    var eR = to || today;
    return { start: sR, end: eR, title: shortLabel(sR)+' – '+shortLabel(eR) };
  }
  return { start: naturalAnchor, end: today, title: "All Time (Since "+shortLabel(naturalAnchor)+")" };
}

    var offStart = (startMonthStart.getFullYear()-now.getFullYear())*12 + (startMonthStart.getMonth()-now.getMonth());

    for (var mOff = offStart; mOff <= offEnd && months.length < 36; mOff++) {

    s += '<span class="eyebrow">Biggest transactions</span>';

    s += '</div>';

    if (topList.length === 0) {
      s += '<div class="muted" style="font-size:13px;">Nothing logged in this period.</div>';
    } else {
      topList.forEach(function(entry, i){
        s += renderTxnRow(entry.date, entry.item);
      });
    }
    s += '</div>';
    return s;
  };

  var order = normalizeAnalysisOrder(state.settings.analysisSectionOrder);
  order.forEach(function(id, idx){
    var content = sectionHtml[id] ? sectionHtml[id]() : "";
    if (!content) return;

      h += '<div class="row between reorder-bar">';
      h += '<span style="font-size:12px; font-weight:600; color:var(--accent);">'+esc(ANALYSIS_SECTION_LABELS[id]||id)+'</span>';
      h += '<div class="row gap2">';
      h += '<button data-action="move-analysis-section" data-section="'+id+'" data-dir="-1" class="icon-btn" style="padding:4px 10px; width:auto; height:28px; font-size:11px; border-radius:8px; background:var(--card); color:'+(idx===0?"var(--hairline)":"var(--text)")+';" '+(idx===0?"disabled":"")+' aria-label="Move up">'+ICONS.chevronUp+' Up</button>';
      h += '<button data-action="move-analysis-section" data-section="'+id+'" data-dir="1" class="icon-btn" style="padding:4px 10px; width:auto; height:28px; font-size:11px; border-radius:8px; background:var(--card); color:'+(idx===order.length-1?"var(--hairline)":"var(--text)")+';" '+(idx===order.length-1?"disabled":"")+' aria-label="Move down">'+ICONS.chevronDown+' Down</button>';
      h += '</div></div>';
    }
    h += content;
  });
  return h;
}

/* ---------------- Transactions Body ---------------- */
function renderTransactionsBody() {
  var entryDates = Object.keys(state.entries).sort();
  var cumAnchor = state.settings.trackingStartDate || (entryDates.length ? entryDates[0] : todayStr());
  var cs = periodStats(cumAnchor, todayStr());
  var acc = 0;
  var balanceMap = {};
  cs.rows.forEach(function(r){ acc = round2(acc + (r.allowance-r.spent)); balanceMap[r.date] = acc; });
  var categoryFilter = state.txnCategoryFilter || "";
  var periodMode = state.txnPeriodMode || "all";
  var periodAnchor = state.txnPeriodDate || "";
  var periodFrom = state.txnPeriodFrom || "";
  var periodTo = state.txnPeriodTo || "";
  function itemCat(it){ return it.category || "Uncategorised"; }
  function periodWeekBounds(){ var s = startOfWeek(parseD(periodAnchor)); return { start: toStr(s), end: toStr(addDays(s,6)) }; }
  function periodMonthBounds(){ var s = startOfMonth(parseD(periodAnchor)); return { start: toStr(s), end: toStr(endOfMonth(s)) }; }
  function inPeriod(d) {
    if (periodMode === "week") {
      if (!periodAnchor) return true;
      var wb = periodWeekBounds(); return d >= wb.start && d <= wb.end;
    }
    if (periodMode === "month") {
      if (!periodAnchor) return true;
      var mb = periodMonthBounds(); return d >= mb.start && d <= mb.end;
    }
    if (periodMode === "range") {
      if (periodFrom && d < periodFrom) return false;
      if (periodTo && d > periodTo) return false;
      return true;
    }
    return true;
  }
  var filterOptions = (state.settings.categories||[]).slice();
  filterOptions.push("Uncategorised");

  var h = '<div class="card" style="overflow:hidden; margin-bottom:16px;">';
  h += '<div class="eyebrow" style="padding:16px 18px 4px;">All transactions</div>';
  h += '<div class="muted" style="font-size:11px; padding:0 18px 12px;">Balance tracks rollover accrual across all days.</div>';
  h += '<div style="padding:0 16px 8px;"><select id="txnCategoryFilterSelect" class="field" style="font-size:13px;">';
  h += '<option value=""'+(categoryFilter===""?" selected":"")+'>All categories</option>';
  filterOptions.forEach(function(c){
    h += '<option value="'+esc(c)+'"'+(categoryFilter===c?" selected":"")+'>'+esc(c)+'</option>';
  });
  h += '</select></div>';

  h += '<div style="padding:0 16px 8px;"><select id="txnPeriodModeSelect" class="field" style="font-size:13px;">';
  [["all","All time"],["week","Specific week"],["month","Specific month"],["range","Custom range"]].forEach(function(opt){
    h += '<option value="'+opt[0]+'"'+(periodMode===opt[0]?" selected":"")+'>'+opt[1]+'</option>';
  });
  h += '</select></div>';

  if (periodMode === "week" || periodMode === "month") {
    h += '<div style="padding:0 16px 8px;"><input id="txnPeriodAnchorInput" type="date" class="field mono" style="font-size:13px;" value="'+esc(periodAnchor)+'" max="'+todayStr()+'" /></div>';
  }
  if (periodMode === "range") {
    h += '<div class="row gap2" style="padding:0 16px 8px;">';
    h += '<input id="txnPeriodFromInput" type="date" class="field mono" style="flex:1; font-size:13px;" value="'+esc(periodFrom)+'" max="'+todayStr()+'" />';
    h += '<input id="txnPeriodToInput" type="date" class="field mono" style="flex:1; font-size:13px;" value="'+esc(periodTo)+'" max="'+todayStr()+'" />';
    h += '</div>';
  }

  var datesDesc = entryDates.slice().reverse();
  var dates = datesDesc.filter(function(d){
    if (!inPeriod(d)) return false;
    if (categoryFilter) return state.entries[d].items.some(function(it){ return itemCat(it) === categoryFilter; });
    return true;
  });

  if (dates.length === 0) {
    h += '<div class="muted" style="padding:20px; font-size:14px; text-align:center;">No matching transactions.</div>';
  } else {
    dates.forEach(function(date, i){
      var day = state.entries[date];
      var spent = sumSpent(day);
      var delta = day.allowance - spent;
      var bal = balanceMap[date];
      var displayItems = categoryFilter ? day.items.filter(function(it){ return itemCat(it) === categoryFilter; }) : day.items;
      var dayFilteredSpent = displayItems.reduce(function(s,it){ return s+it.amount; }, 0);
      h += '<div style="padding:14px 16px;'+(i===0?"":"border-top:1px solid var(--hairline);")+'">';
      h += '<div class="row between">';
      h += '<div><div style="font-size:14px; font-weight:600;">'+esc(dayLabel(date))+'</div>';
      h += '<div class="mono muted" style="font-size:11px; margin-top:2px;">'+day.items.length+' txn'+(day.items.length===1?"":"s")+' · spent '+fmt(spent,2)+' of '+fmt(day.allowance,2)+'</div></div>';
      if (categoryFilter) {
        h += '<div style="text-align:right;"><div class="mono" style="font-size:13px; font-weight:600; color:var(--rust);">−'+fmt(dayFilteredSpent,2)+'</div><div class="mono muted" style="font-size:10px;">in '+esc(categoryFilter)+'</div></div>';
      } else {
        h += '<div style="text-align:right;"><div class="mono" style="font-size:13px; font-weight:600; color:'+(delta>=0?"var(--positive)":"var(--rust)")+';">'+(delta>=0?"+":"−")+fmt(Math.abs(delta),2)+'</div><div class="mono muted" style="font-size:10px;">bal '+fmt(bal,0)+'</div></div>';
      }
      h += '</div>';
      h += '<div style="margin-top:8px;">';
      newestFirst(displayItems).forEach(function(it){
        h += renderTxnRow(date, it);
      });
      h += '</div></div>';
    });
  }
  h += '</div>';
  h += '<div style="text-align:center; margin-bottom:16px;"><button data-action="open-reset" style="background:none;border:none;padding:0;color:var(--text-muted);font-size:11px;">Clear all entries</button></div>';
  return h;
}

function renderTxnRow(date, it) {
  var key = date+"|"+it.id;
  if (state.pendingDeleteKey === key) {
    return '<div class="row between" style="background:var(--rust-wash); border-radius:12px; padding:10px 12px; margin-bottom:4px;">'
      + '<span style="font-size:12px; font-weight:500;">Delete transaction?</span>'
      + '<div class="row gap2"><button data-action="delete-txn" data-date="'+date+'" data-id="'+esc(it.id)+'" style="background:var(--rust);border:none;border-radius:8px;padding:6px 10px;color:#fff;" aria-label="Confirm delete">'+ICONS.check+'</button>'
      + '<button data-action="cancel-delete-txn" style="background:none;border:1px solid var(--hairline-strong);border-radius:8px;padding:6px 10px;color:var(--text-muted);" aria-label="Cancel">'+ICONS.x+'</button></div></div>';
  }
  var h = '<div class="row interactive-card" style="align-items:center; gap:12px; padding:8px 4px; margin-bottom:2px; border-radius:10px;">';
  h += '<button data-action="edit-txn" data-date="'+date+'" data-id="'+esc(it.id)+'" style="background:none;border:none;padding:0;flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;">';
  h += catIconCircle(it.category);
  h += '<span style="min-width:0; flex:1;">';
  h += '<div style="font-size:14px; font-weight:500; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">'+(it.note?esc(it.note):(it.category?esc(it.category):"Spent"))+'</div>';
  h += '<div class="muted" style="font-size:11px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">'+esc(dayLabel(date))+' · '+(it.category?esc(it.category):"Uncategorised")+'</div>';
  h += '</span></button>';
  h += '<div class="mono" style="font-size:14px; font-weight:600; color:var(--rust); flex-shrink:0;">−'+fmt(it.amount,2)+' AED</div>';
  h += '<button data-action="ask-delete-txn" data-date="'+date+'" data-id="'+esc(it.id)+'" style="background:none;border:none;padding:6px;color:var(--text-muted);flex-shrink:0;" aria-label="Delete">'+ICONS.trash+'</button>';
  h += '</div>';
  return h;
}

/* ---------------- Calendar Body ---------------- */
function renderCalendarBody() {
  var base = addMonths(startOfMonth(new Date()), state.calendarOffset);
  var monthStartStr = toStr(base);
  var monthEndStr = toStr(endOfMonth(base));
  var title = base.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
  var da = dailyAllowance();
  var today = todayStr();
  var tsd = state.settings.trackingStartDate;
  var h = "";
  h += '<div class="card" style="padding:16px; margin-bottom:14px;">';
  h += '<div class="row between" style="margin-bottom:14px;">';
  h += '<button data-action="cal-nav" data-delta="-1" class="icon-btn" aria-label="Previous month">'+ICONS.chevronLeft+'</button>';
  h += '<div style="font-size:15px; font-weight:600;">'+esc(title)+'</div>';
  h += '<button data-action="cal-nav" data-delta="1" class="icon-btn" style="'+(state.calendarOffset>=0?"opacity:0.3;pointer-events:none;":"")+'" aria-label="Next month">'+ICONS.chevronRight+'</button>';
  h += '</div>';
  h += '<div style="display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:8px;">';
  ["Mo","Tu","We","Th","Fr","Sa","Su"].forEach(function(lbl){ h += '<div class="muted" style="text-align:center; font-size:11px; font-weight:500;">'+lbl+'</div>'; });
  h += '</div>';
  var firstDow = base.getDay();
  var leadingBlanks = firstDow===0 ? 6 : firstDow-1;
  h += '<div style="display:grid; grid-template-columns:repeat(7,1fr); gap:6px;">';
  for (var i=0;i<leadingBlanks;i++) h += '<div></div>';
  var cur = parseD(monthStartStr);
  while (toStr(cur) <= monthEndStr) {
    var ds = toStr(cur);
    var e = state.entries[ds];
    var logged = !!e;
    var spent = logged ? sumSpent(e) : 0;
    var allowance = logged ? e.allowance : da;
    var isFuture = ds > today;
    var isPreTracking = tsd && ds < tsd;
    var isToday = ds === today;
    var isSelected = state.calendarSelectedDate === ds;
    var bg, fg;
    if (isFuture) { bg = "transparent"; fg = "var(--text-muted)"; }
    else if (isPreTracking) { bg = "rgba(255,255,255,0.03)"; fg = "var(--text-muted)"; }
    else if (!logged) { bg = "rgba(229, 184, 105, 0.12)"; fg = "var(--text)"; }
    else if (spent <= allowance) { bg = "rgba(229, 184, 105, 0.28)"; fg = "var(--text)"; }
    else { bg = "var(--rust-wash)"; fg = "var(--rust)"; }
    var isTracked = !isFuture && !isPreTracking;
    var border = isToday ? "2px solid var(--accent)" : (isSelected ? "2px solid #FFFFFF" : "1px solid transparent");
    h += '<button data-action="cal-select" data-date="'+ds+'" style="min-height:64px; border-radius:12px; border:'+border+'; background:'+bg+'; color:'+fg+'; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:5px 2px; gap:3px;">';
    h += '<span style="font-size:14px; font-weight:600;">'+cur.getDate()+'</span>';
    var spentText = logged ? fmt(spent,0) : (isTracked ? "0" : "\u00A0");
    h += '<span class="mono" style="font-size:10px; line-height:1;">'+spentText+'</span>';
    var dayDelta = allowance - spent;
    var deltaText = "\u00A0", deltaClr = fg;
    if (isTracked) {
      deltaClr = dayDelta >= 0 ? "var(--positive)" : "var(--rust)";
      deltaText = (dayDelta>=0?"+":"−")+fmt(Math.abs(dayDelta),0);
    }
    h += '<span class="mono" style="font-size:10px; line-height:1; font-weight:500; color:'+deltaClr+';">'+deltaText+'</span>';
    h += '</button>';
    cur = addDays(cur,1);
  }
  h += '</div>';
  h += '</div>';

  if (state.calendarSelectedDate) {
    var sd = state.calendarSelectedDate;
    var sday = state.entries[sd];
    h += '<div class="card" style="padding:16px 18px; margin-bottom:16px;">';
    h += '<div class="eyebrow" style="margin-bottom:8px;">'+esc(dayLabel(sd))+'</div>';
    if (sday && sday.items.length) {
      newestFirst(sday.items).forEach(function(it){ h += renderTxnRow(sd, it); });
    } else {
      h += '<div class="muted" style="font-size:13px;">Nothing logged on this day.</div>';
    }
    h += '</div>';
  }
  return h;
}

  var tabs = [
    {id:"home", label:"Home", icon:ICONS.home},
    {id:"transactions", label:"Transactions", icon:ICONS.list},
    {id:"calendar", label:"Calendar", icon:ICONS.calendar},
    {id:"analysis", label:"Analysis", icon:ICONS.chart},
  ];
  var h = '<nav style="position:fixed; left:0; right:0; bottom:var(--vvb, 0px); display:flex; backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); background:rgba(10, 15, 29, 0.82); border-top:1px solid var(--hairline); padding:8px 4px calc(env(safe-area-inset-bottom, 0px) + 8px); z-index:40;">';
  tabs.forEach(function(t){
    var active = state.page===t.id;
    h += '<button data-action="go-page" data-page="'+t.id+'" style="flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; padding:4px 0; color:'+(active?"var(--accent)":"var(--text-muted)")+'; transition:color 0.15s ease;">'+t.icon+'<span style="font-size:10px; font-weight:'+(active?600:500)+';">'+t.label+'</span></button>';
  });
  h += '</nav>';
  return h;
}

function statBlock(label, value, color) {
  return '<div><div class="eyebrow">'+esc(label)+'</div><div class="mono" style="font-size:15px; font-weight:600; margin-top:3px; color:'+color+';">'+value+'</div></div>';
}

/* ---------------- Event Delegation & Handlers ---------------- */
function handleAddTransaction() {
  var dateEl = document.getElementById("entryDateInput");
  var amtEl = document.getElementById("entryAmountInput");
  var noteEl = document.getElementById("entryNoteInput");
  var catEl = document.getElementById("entryCategoryInput");
  var date = dateEl ? dateEl.value : todayStr();
  var amt = parseFloat(amtEl ? amtEl.value : "");
  if (isNaN(amt) || amt < 0 || !date) return;
  var note = noteEl ? noteEl.value.trim() : "";
  var category = catEl ? catEl.value : "";
  var nextEntries = Object.assign({}, state.entries);
  var wasEditing = !!(state.editingItemId && state.editingOriginalDate);

  if (wasEditing) {
    var origDate = state.editingOriginalDate;
    var origDay = nextEntries[origDate];
    var carriedAllowance = origDay ? origDay.allowance : dailyAllowance();
    if (origDay) {
      var remaining = origDay.items.filter(function(i){ return i.id !== state.editingItemId; });
      if (remaining.length === 0) delete nextEntries[origDate];
      else nextEntries[origDate] = Object.assign({}, origDay, { items: remaining });
    }
    var updatedItem = { id: state.editingItemId, amount: amt, note: note, category: category };
    var destDay = nextEntries[date];
    var nextDest = destDay ? Object.assign({}, destDay, { items: destDay.items.concat([updatedItem]) }) : { allowance: carriedAllowance, items: [updatedItem] };
    nextEntries[date] = nextDest;
    state.editingItemId = null;
    state.editingOriginalDate = null;
    state.showAddTxn = false;
  } else {
    var existing = nextEntries[date];
    var newItem = { id: Date.now()+"-"+Math.random().toString(36).slice(2,7), amount: amt, note: note, category: category };
    nextEntries[date] = existing ? Object.assign({}, existing, { items: existing.items.concat([newItem]) }) : { allowance: dailyAllowance(), items: [newItem] };
    state.showAddTxn = false;
  }
  state.entryDate = date;
  persistAll(state.settings, nextEntries, "your entry");
  showToast(wasEditing ? "Record updated" : "Record added");
  render();
}

function handleApplyBudget(scope) {
  var wEl = document.getElementById("weeklyDraftInput");
  var v = wEl ? parseFloat(wEl.value) : NaN;
  if (isNaN(v) || v <= 0) return;
  var newDaily = v / 7;
  var wk = getPeriodBounds("week", 0, v, newDaily);
  var hist = (state.settings.rateHistory || []).slice();
  var nextEntries = Object.assign({}, state.entries);
  var label;
  function rewriteLoggedFrom(fromStr, toStr_) {
    Object.keys(nextEntries).forEach(function(d){
      if (d >= fromStr && (!toStr_ || d <= toStr_)) {
        nextEntries[d] = Object.assign({}, nextEntries[d], { allowance: newDaily });
      }
    });
  }
  if (scope === "all") {
    hist = [{ from: "1900-01-01", weeklyTarget: v }];
    rewriteLoggedFrom("1900-01-01", null);
    label = "Applied to all periods";
  } else if (scope === "future") {
    hist.push({ from: wk.startStr, weeklyTarget: v });
    rewriteLoggedFrom(wk.startStr, null);
    label = "Applied from this week onward";
  } else {
    var prevRate = rateForDate(wk.startStr);
    var dayAfter = toStr(addDays(parseD(wk.endStr), 1));
    hist.push({ from: wk.startStr, weeklyTarget: v });
    hist.push({ from: dayAfter, weeklyTarget: prevRate });
    rewriteLoggedFrom(wk.startStr, wk.endStr);
    label = "Applied to this week only";
  }
  hist = normalizeRateHistory(hist);
  var nextSettings = Object.assign({}, state.settings, { rateHistory: hist });
  nextSettings.weeklyTarget = (function(){
    var r = hist[0].weeklyTarget, t = todayStr();
    for (var i=0;i<hist.length;i++){ if (hist[i].from <= t) r = hist[i].weeklyTarget; else break; }
    return r;
  })();
  persistAll(nextSettings, nextEntries, "your budget");
  state.showSettings = false;
  showToast(label);
  render();
}

function showToast(msg) {
  state.toastMessage = msg;
  setTimeout(function(){ state.toastMessage = null; render(); }, 2200);
}

function handleEditTxn(date, id) {
  state.entryDate = date;
  state.editingItemId = id;
  state.editingOriginalDate = date;
  state.showAddTxn = true;
  state.pendingDeleteKey = null;
  render();
}

function handleDeleteTxn(date, id) {
  var day = state.entries[date];
  if (!day) return;
  var remaining = day.items.filter(function(i){ return i.id !== id; });
  var nextEntries = Object.assign({}, state.entries);
  if (remaining.length === 0) delete nextEntries[date]; else nextEntries[date] = Object.assign({}, day, { items: remaining });
  if (state.editingItemId === id) { state.editingItemId = null; state.editingOriginalDate = null; }
  persistAll(state.settings, nextEntries, "your entry");
  render();
}

function handleCopyBackup() {
  var btn = document.getElementById("copyBackupBtn");
  var text = JSON.stringify({settings:state.settings, entries:state.entries}, null, 2);
  function done(msg) { if (btn) { btn.textContent = msg; setTimeout(function(){ if(btn) btn.textContent = "Copy Backup"; }, 2500); } }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ done("Copied ✓"); }).catch(function(){ done("Select the text above to copy"); });
  } else {
    done("Select the text above to copy");
  }
}

function handleRestore() {
  var el = document.getElementById("restoreInput");
  var raw = el ? el.value : "";
  try {
    var parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object" || typeof parsed.entries !== "object") throw new Error("bad shape");
    var nextSettings = Object.assign({}, DEFAULT_SETTINGS, parsed.settings||{});
    nextSettings.analysisSectionOrder = normalizeAnalysisOrder(nextSettings.analysisSectionOrder);
    var nextEntries = migrateEntries(parsed.entries||{}, nextSettings.weeklyTarget/7);
    persistAll(nextSettings, nextEntries, "restored data");
    state.restoreError = null;
    state.showBackup = false;
  } catch(e) {
    state.restoreError = "Invalid backup text — paste the exact backup JSON.";
  }
  render();
}

document.addEventListener("click", function(e) {
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.dataset.action;
  switch(action) {
    case "open-backup": state.showBackup = true; render(); break;
    case "close-backup": state.showBackup = false; state.restoreError = null; render(); break;
    case "open-settings": state.showSettings = true; render(); break;
    case "close-settings": state.showSettings = false; render(); break;
    case "open-reset": state.showResetConfirm = true; render(); break;
    case "close-reset": state.showResetConfirm = false; render(); break;
    case "toggle-theme":
      persistAll(Object.assign({}, state.settings, { theme: state.settings.theme==="dark"?"light":"dark" }), state.entries, "your settings");
      render();
      break;
    case "switch-view": state.view = el.dataset.view; state.offset = 0; render(); break;
    case "nav-offset":
      var delta = parseInt(el.dataset.delta,10);
      state.offset = Math.min(0, state.offset + delta);
      render();
      break;
    case "add-transaction": handleAddTransaction(); break;
    case "delete-txn":
      handleDeleteTxn(el.dataset.date, el.dataset.id);
      state.pendingDeleteKey = null;
      break;
    case "ask-delete-txn":
      state.pendingDeleteKey = el.dataset.date+"|"+el.dataset.id;
      render();
      break;
    case "cancel-delete-txn":
      state.pendingDeleteKey = null;
      render();
      break;
    case "edit-txn": handleEditTxn(el.dataset.date, el.dataset.id); break;
    case "open-add-txn":
      state.editingItemId = null;
      state.editingOriginalDate = null;
      state.entryDate = todayStr();
      state.showAddTxn = true;
      state.pendingDeleteKey = null;
      render();
      break;
    case "close-add-txn":
      state.showAddTxn = false;
      state.editingItemId = null;
      state.editingOriginalDate = null;
      render();
      break;
    case "go-page":
      state.editingItemId = null;
      state.editingOriginalDate = null;
      state.showAddTxn = false;
      state.pendingDeleteKey = null;
      state.page = el.dataset.page;
      render();
      break;
    case "cal-nav":
      state.calendarOffset += parseInt(el.dataset.delta,10);
      state.calendarSelectedDate = null;
      render();
      break;
    case "cal-select":
      state.calendarSelectedDate = (state.calendarSelectedDate === el.dataset.date) ? null : el.dataset.date;
      render();
      break;
    case "retry-save":
      if (state.saveError) { var se = state.saveError; state.saveError = null; persistAll(se.nextSettings, se.nextEntries, se.label); }
      render();
      break;
    case "settings-tab":
      state.settingsTab = el.dataset.tab;
      render();
      break;
    case "save-tracking":
      var tsEl = document.getElementById("trackingStartInput");
      var trackSettings = Object.assign({}, state.settings, { trackingStartDate: (tsEl && tsEl.value) ? tsEl.value : null });
      persistAll(trackSettings, state.entries, "your settings");
      showToast("Tracking date saved");
      render();
      break;
    case "apply-budget":
      handleApplyBudget(el.dataset.scope);
      break;
    case "add-category":
      var newCatEl = document.getElementById("newCategoryInput");
      var newCat = newCatEl ? newCatEl.value.trim() : "";
      if (newCat && (state.settings.categories||[]).indexOf(newCat) === -1) {
        var withCat = Object.assign({}, state.settings, { categories: (state.settings.categories||[]).concat([newCat]) });
        persistAll(withCat, state.entries, "your settings");
        render();
      }
      break;
    case "remove-category":
      var catToRemove = el.dataset.cat;
      var withoutCat = Object.assign({}, state.settings, { categories: (state.settings.categories||[]).filter(function(c){ return c !== catToRemove; }) });
      persistAll(withoutCat, state.entries, "your settings");
      render();
      break;
    case "move-category":
      var dir = parseInt(el.dataset.dir,10);
      var cats2 = (state.settings.categories||[]).slice();
      var idx = cats2.indexOf(el.dataset.cat);
      var swapIdx = idx + dir;
      if (idx >= 0 && swapIdx >= 0 && swapIdx < cats2.length) {
        var tmp = cats2[idx]; cats2[idx] = cats2[swapIdx]; cats2[swapIdx] = tmp;
        persistAll(Object.assign({}, state.settings, { categories: cats2 }), state.entries, "your settings");
        render();
      }
      break;
    case "toggle-analysis-reorder":
      state.analysisReorderMode = !state.analysisReorderMode;
      render();
      break;
    case "move-analysis-section":
      var dirA = parseInt(el.dataset.dir,10);
      var orderA = normalizeAnalysisOrder(state.settings.analysisSectionOrder);
      var idxA = orderA.indexOf(el.dataset.section);
      var swapA = idxA + dirA;
      if (idxA >= 0 && swapA >= 0 && swapA < orderA.length) {
        var tmpA = orderA[idxA]; orderA[idxA] = orderA[swapA]; orderA[swapA] = tmpA;
        persistAll(Object.assign({}, state.settings, { analysisSectionOrder: orderA }), state.entries, "your settings");
        render();
      }
      break;
    case "analysis-select-period-pill":
      state.analysisPeriodMode = el.dataset.mode;
      state.analysisSelectedDate = null;
      render();
      break;
    case "analysis-select-day":
      state.analysisSelectedDate = (state.analysisSelectedDate === el.dataset.date) ? null : el.dataset.date;
      render();
      break;
    case "analysis-clear-day":
      state.analysisSelectedDate = null;
      render();
      break;
    case "analysis-select-cat":
      state.analysisSelectedCategory = (state.analysisSelectedCategory === el.dataset.cat) ? null : el.dataset.cat;
      render();
      break;
    case "analysis-clear-cat":
      state.analysisSelectedCategory = null;
      render();
      break;
    case "analysis-select-dow":
      var dowVal = parseInt(el.dataset.dow, 10);
      state.analysisSelectedDow = (state.analysisSelectedDow === dowVal) ? null : dowVal;
      render();
      break;
    case "analysis-toggle-top-limit":
      state.analysisTopLimit = (state.analysisTopLimit === 5) ? 10 : 5;
      render();
      break;
    case "copy-backup": handleCopyBackup(); break;
    case "restore-backup": handleRestore(); break;
    case "confirm-reset":
      persistAll(state.settings, {}, "reset");
      state.showResetConfirm = false;
      render();
      break;
  }
});

document.addEventListener("change", function(e) {
  if (e.target && e.target.id === "txnCategoryFilterSelect") { state.txnCategoryFilter = e.target.value; render(); }
  if (e.target && e.target.id === "txnPeriodModeSelect") {
    state.txnPeriodMode = e.target.value;
    if ((state.txnPeriodMode === "week" || state.txnPeriodMode === "month") && !state.txnPeriodDate) state.txnPeriodDate = todayStr();
    render();
  }
  if (e.target && e.target.id === "txnPeriodAnchorInput") { state.txnPeriodDate = e.target.value; render(); }
  if (e.target && e.target.id === "txnPeriodFromInput") { state.txnPeriodFrom = e.target.value; render(); }
  if (e.target && e.target.id === "txnPeriodToInput") { state.txnPeriodTo = e.target.value; render(); }
  if (e.target && e.target.id === "analysisPeriodFromInput") { state.analysisPeriodFrom = e.target.value; render(); }
  if (e.target && e.target.id === "analysisPeriodToInput") { state.analysisPeriodTo = e.target.value; render(); }
});

/* ---------------- Viewport & Initialization ---------------- */
function setViewportHeightVar() {
  document.documentElement.style.setProperty("--vh100", window.innerHeight + "px");
}
setViewportHeightVar();
window.addEventListener("resize", setViewportHeightVar);
window.addEventListener("orientationchange", setViewportHeightVar);

function updateVisualViewportOffset() {
  var vv = window.visualViewport;
  if (!vv) { document.documentElement.style.setProperty("--vvb", "0px"); return; }
  var gap = window.innerHeight - vv.height - vv.offsetTop;
  document.documentElement.style.setProperty("--vvb", Math.max(0, Math.round(gap)) + "px");
}
updateVisualViewportOffset();
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", updateVisualViewportOffset);
  window.visualViewport.addEventListener("scroll", updateVisualViewportOffset);
}
setTimeout(updateVisualViewportOffset, 300);
setTimeout(updateVisualViewportOffset, 1000);

loadInitial();
render();
</script>
